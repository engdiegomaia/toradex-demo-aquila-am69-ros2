# Decimation of the joint_state_broadcaster to 50 Hz, loaded by the spawner in
# quadruped.launch.py (`--param-file`).
#
# WHY THIS FILE EXISTS
#
# Measured on the HIL run of 28/08/2026 (docs/results/ml35-f5-tf-cpu-baseline.md §6):
#
#     ros2 topic hz /tf      average rate: 1090.898   (window of 10000)
#     ros2 topic info /tf    4 publishers | 11 subscribers
#
# The controller_manager runs at 1000 Hz because physics runs at 1000 Hz, and
# without its own `update_rate` a controller inherits that rate. The
# joint_state_broadcaster was therefore publishing /joint_states at 1 kHz,
# robot_state_publisher converted every sample into a TFMessage, and eleven
# subscribers deserialized the result -- crossing the Ethernet link, because
# robot_state_publisher runs on the HOST and the navigation subscribers run on
# the Aquila.
#
# Nav2 consumes none of this. The edges navigation uses -- `base -> lidar`,
# `base -> trunk` -- are FIXED joints and robot_state_publisher already emits
# them once, on /tf_static. The 1090 Hz is the twelve LEG joints, which only
# matter for visualization.
#
# WHAT THIS FILE DOES NOT CHANGE, AND WHY
#
# The decimation is on the BROADCASTER, not on the control loop. Preserved on
# purpose, because each of these has measured behaviour tied to its rate:
#
#     controller_manager.update_rate  1000 Hz   go2_description/config/gazebo.yaml
#     unitree_guide_controller         200 Hz   same file (gait, ML3.5 F2/F4)
#     ocs2_quadruped_controller        200 Hz   same file
#     physics step                    1000 Hz   SDF world
#     imu_sensor_broadcaster        inherited    same file
#     odometry                      unchanged    bridge_quadruped.yaml
#
# `update_rate: 50` with the CM at 1000 gives a decimation factor of exactly
# 20. The ControllerManager calls the broadcaster's update() once every 20
# cycles, and JointStateBroadcaster publishes inside that update() -- so
# /joint_states drops to 50 Hz without any other controller losing a single
# cycle.
#
# 50 Hz was chosen to match the rate of /demo/odom, the dynamic edge
# navigation actually expects at 50 Hz. There is no gain in publishing joint
# pose faster than the edge it accompanies.
#
# WHY HERE AND NOT IN go2_description/config/gazebo.yaml
#
# Same reason as config/gait_go2.yaml, and that file's header explains it in
# detail: go2_description is a vendored package whose README guarantees the
# files are byte-identical to upstream, and that guarantee is what underpins
# the licensing argument. The injection point that belongs to the project is
# the spawner.
#
# ROLLBACK
#
# `jsb_params:=''` on the launch command line, or delete the `--param-file`
# from the joint_state_broadcaster spawner. The broadcaster goes back to
# inheriting 1000 Hz. Do not touch controller_manager.update_rate to revert
# this.

joint_state_broadcaster:
  ros__parameters:
    update_rate: 50  # Hz
