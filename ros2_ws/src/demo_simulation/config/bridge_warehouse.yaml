# ros_gz_bridge topic mappings — ML3.
#
# Runs on: x86 host only. The bridge lives next to Gazebo, never on the module.
#
# Every ROS-side name is inside the /demo namespace, per the topic contract in
# CLAUDE.md. The gz-side names are the short <topic> values declared in
# demo_description's URDF (_sensors.xacro) and in the DiffDrive plugin block.
#
# NO entry here is model-scoped, and that is deliberate — every gz name below
# is a literal short topic. Gazebo advertises /model/<robot_name>/... lookalikes
# that carry no publisher; see the detailed note on /demo/cmd_vel below before
# "fixing" any name in this file.
#
# Verify the gz side with `gz topic -l` while the sim runs before trusting this
# file — a silent name mismatch shows up as a topic that simply never publishes.

# Simulation clock. Must be first: every node runs with use_sim_time:=true and
# will block waiting for /clock if this bridge is missing.
- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

# Velocity commands. Nav2 (or teleop) -> Gazebo. The one topic that makes the
# diff-drive/quadruped swap in ML3.5 cheap.
#
# UNSCOPED ON PURPOSE — verified with `gz topic -i`, do not "fix" to
# /model/demo_robot/cmd_vel. The DiffDrive plugin's <topic>, <odom_topic> and
# <tf_topic> elements (see demo_description/urdf/demo_robot.urdf.xacro) take
# the name literally and are NOT model-scoped. Gazebo also advertises
# /model/demo_robot/{cmd_vel,odom,tf} as its default names, which is the trap:
# those exist in `gz topic -l` and look right, but nothing is attached to them.
# Bridging to the scoped names produced a robot that never moved and odometry
# that never published, with no error anywhere.
- ros_topic_name: "/demo/cmd_vel"
  gz_topic_name: "/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

# Wheel odometry from the DiffDrive plugin. Unscoped — see the note above.
- ros_topic_name: "/demo/odom"
  gz_topic_name: "/odom"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

# odom -> base_link transform, published by the DiffDrive plugin.
#
# base_link, NOT base_footprint: upstream's create3.urdf.xacro hardcodes that
# child_frame_id and there is no xacro arg to change it. Nav2 is configured with
# robot_base_frame: base_link to match. The two frames coincide anyway
# (base_footprint_joint is an identity transform), and a test in
# demo_description/test/test_urdf_parses.py fails if a future upstream bump gives
# that joint a real offset.
#
# Bridged to /tf directly: this is the only owner of that edge (see
# demo_description/README.md TF ownership table). Unscoped — see the note above.
- ros_topic_name: "/tf"
  gz_topic_name: "/tf"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "gz.msgs.Pose_V"
  direction: GZ_TO_ROS

# Wheel joint angles -> robot_state_publisher, so the wheel TFs animate.
# Unscoped for the same reason as cmd_vel/odom/tf above: the
# JointStatePublisher plugin's <topic>joint_states</topic> is literal. The
# world-scoped /world/warehouse/model/demo_robot/joint_state is advertised too
# but carries no publisher — and being world-scoped it would also have broken
# the moment the world was renamed.
- ros_topic_name: "/joint_states"
  gz_topic_name: "/joint_states"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS

# 2D lidar -> Nav2 costmaps.
- ros_topic_name: "/demo/scan"
  gz_topic_name: "/scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS

# Camera -> demo_perception. The input side of the perception contract:
# demo_perception must never learn that this bridge is where its images
# come from.
#
# The gz-side name is /rgbd_camera/image, NOT /camera/image_raw. The robot is now
# the upstream TurtleBot 4 (see demo_description/urdf/demo_robot.urdf.xacro),
# whose sensor is an OAK-D Pro declared as a single `rgbd_camera` sensor. Gazebo
# derives all four topics below from that one sensor name. The ROS-side name stays
# /demo/camera/image_raw because that is the topic contract in CLAUDE.md — the
# whole point is that demo_perception does not change when the source does.
- ros_topic_name: "/demo/camera/image_raw"
  gz_topic_name: "/rgbd_camera/image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

# Camera intrinsics. Gazebo derives this topic from the sensor name by appending
# camera_info.
- ros_topic_name: "/demo/camera/camera_info"
  gz_topic_name: "/rgbd_camera/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS

# Depth image. New capability: the old hand-built model had a mono RGB camera
# only. Not consumed by anything yet — demo_perception is still the deterministic
# synthetic-detection stub — but bridged so the TIDL work (MX-TIDL) has a depth
# source without touching this file, and so RViz2 can show it during the demo.
- ros_topic_name: "/demo/camera/depth_image"
  gz_topic_name: "/rgbd_camera/depth_image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

# Depth point cloud, derived by Gazebo from the same RGBD sensor.
#
# Bandwidth warning: this is by far the heaviest topic in this file (~640x480
# XYZRGB at 10 Hz). It is bridged because a 3D obstacle source is the single
# biggest available navigation improvement (see docs/analise-sensores-navegacao.md),
# but on the `target` mode the DDS traffic crosses the network to the module.
# Comment this entry out if the demo does not need 3D obstacles.
- ros_topic_name: "/demo/camera/points"
  gz_topic_name: "/rgbd_camera/points"
  ros_type_name: "sensor_msgs/msg/PointCloud2"
  gz_type_name: "gz.msgs.PointCloudPacked"
  direction: GZ_TO_ROS

# IMU at 200 Hz. New capability from the upstream model — the old one had none.
#
# This only publishes if the WORLD loads gz-sim-imu-system. The bundled
# nav2_minimal_tb4_sim warehouse.sdf does; a hand-written world may not, and the
# sensor then stays silent with no error anywhere. Verify with
# `gz topic -l | grep imu` before blaming this file.
#
# NOT YET CONSUMED by anything. It is bridged so the data is visible and
# measurable now, but no EKF is wired up: fusing it would move ownership of the
# odom -> base_link TF edge from the Gazebo DiffDrive plugin to an
# robot_localization ekf_node, and two publishers on the same edge produce a
# jittering robot with no error message. That is a deliberate follow-up, not an
# oversight — see docs/analise-sensores-navegacao.md ("Otimizacao 4").
- ros_topic_name: "/demo/imu"
  gz_topic_name: "/imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS

# --- Cockpit scene cameras (blue panel, ML3.5 F3b) ---------------------------
#
# Two external views of the world, spawned by
# launch/scene_cameras.launch.py. They do not belong to the robot: they are
# the OPERATOR's camera, and exist to answer "did the robot move?" without
# depending on any node in the stack.
#
# Each one's camera_info is bridged for a reason that is NOT geometry: it is
# the panel's heartbeat. An <img> wired to a multipart/x-mixed-replace stream
# never fires `load` and reports complete=false while the stream is healthy
# (measured in Firefox on 24/08/2026), so the panel cannot tell from the
# element itself whether there is video. It decides based on the freshness of
# camera_info, which arrives at the same rate as the image and costs a few
# bytes. Without these two topics the blue panel shows "no signal" on top of
# video that is actually running.
#
# Deliberately without qos_profile: SENSOR_DATA. Same reasoning as the robot's
# camera image -- on the HIL Ethernet link, 800x600 RGB fragments were
# completely lost as best-effort. Reliable is the bridge's default.
- ros_topic_name: "/demo/cockpit/scene_iso/image_raw"
  gz_topic_name: "/cockpit/scene_iso/image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "/demo/cockpit/scene_iso/camera_info"
  gz_topic_name: "/cockpit/scene_iso/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS

- ros_topic_name: "/demo/cockpit/scene_top/image_raw"
  gz_topic_name: "/cockpit/scene_top/image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "/demo/cockpit/scene_top/camera_info"
  gz_topic_name: "/cockpit/scene_top/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS
