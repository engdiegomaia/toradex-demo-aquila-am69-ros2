# ros_gz_bridge topic mappings — ML3.
#
# Runs on: x86 host only. The bridge lives next to Gazebo, never on the module.
#
# Every ROS-side name is inside the /demo namespace, per the topic contract in
# CLAUDE.md. The gz-side names are the short <topic> values declared in
# demo_description's URDF (_sensors.xacro) and in the DiffDrive plugin block.
# The DiffDrive/JointStatePublisher plugins scope their topics under
# /model/<robot_name>/..., which is why those entries carry the model prefix
# while the sensor entries do not.
#
# Verify the gz side with `gz topic -l` while the sim runs before trusting this
# file — a silent name mismatch shows up as a topic that simply never publishes.

# Simulation clock. Must be first: every node runs with use_sim_time:=true and
# will block waiting for /clock if this bridge is missing.
- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

# Velocity commands. Nav2 (or teleop) -> Gazebo. The one topic that makes the
# diff-drive/quadruped swap in ML3.5 cheap.
#
# UNSCOPED ON PURPOSE — verified with `gz topic -i`, do not "fix" to
# /model/demo_robot/cmd_vel. The DiffDrive plugin's <topic>, <odom_topic> and
# <tf_topic> elements (see demo_description/urdf/demo_robot.urdf.xacro) take
# the name literally and are NOT model-scoped. Gazebo also advertises
# /model/demo_robot/{cmd_vel,odom,tf} as its default names, which is the trap:
# those exist in `gz topic -l` and look right, but nothing is attached to them.
# Bridging to the scoped names produced a robot that never moved and odometry
# that never published, with no error anywhere.
- ros_topic_name: "/demo/cmd_vel"
  gz_topic_name: "/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

# Wheel odometry from the DiffDrive plugin. Unscoped — see the note above.
- ros_topic_name: "/demo/odom"
  gz_topic_name: "/odom"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

# odom -> base_footprint transform, published by the DiffDrive plugin.
# Bridged to /tf directly: this is the only owner of that edge (see
# demo_description/README.md TF ownership table). Unscoped — see the note above.
- ros_topic_name: "/tf"
  gz_topic_name: "/tf"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "gz.msgs.Pose_V"
  direction: GZ_TO_ROS

# Wheel joint angles -> robot_state_publisher, so the wheel TFs animate.
# Unscoped for the same reason as cmd_vel/odom/tf above: the
# JointStatePublisher plugin's <topic>joint_states</topic> is literal. The
# world-scoped /world/warehouse/model/demo_robot/joint_state is advertised too
# but carries no publisher — and being world-scoped it would also have broken
# the moment the world was renamed.
- ros_topic_name: "/joint_states"
  gz_topic_name: "/joint_states"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS

# 2D lidar -> Nav2 costmaps.
- ros_topic_name: "/demo/scan"
  gz_topic_name: "/scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS

# Camera -> demo_perception. The input side of the perception contract:
# demo_perception must never learn that this bridge is where its images
# come from.
- ros_topic_name: "/demo/camera/image_raw"
  gz_topic_name: "/camera/image_raw"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

# Camera intrinsics. Gazebo derives this topic from the image topic by
# replacing the last segment with camera_info.
- ros_topic_name: "/demo/camera/camera_info"
  gz_topic_name: "/camera/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS
