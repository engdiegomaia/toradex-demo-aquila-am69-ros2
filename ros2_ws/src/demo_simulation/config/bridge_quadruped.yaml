# ROS <-> Gazebo boundary for the Go2 plant (ML3.5 F4).
# Runs on the x86 host only, in the sim container.

# O bridge publica /clock DIRETO, sem intermediario. Ja foi tentado o contrario
# -- mandar o clock cru para /demo/clock_raw e republicar por um no Python
# (`clock_throttle`) para reduzir a carga do Aquila -- e foi revertido em
# 21/08/2026: estrangular o clock derruba a navegacao (o A/B esta no cabecalho de
# demo_simulation/clock_throttle.py). Com o hop em passagem direta o custo dele
# ficou DENTRO do ruido de corrida (0.0202 com hop, 0.0232 sem, na mesma
# configuracao); foi removido por ser intermediario sem funcao, nao por medida de
# custo. O no continua no pacote, fora do caminho default.
#
# Se voce voltar a apontar isto para /demo/clock_raw sem tambem subir o
# clock_throttle, nada publica /clock: a simulacao sobe, o robo fica de pe e
# nenhum no com use_sim_time sai do tempo zero. Nada em log nomeia o relogio.
- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

# Temporary ground-truth odometry.  F5 replaces the producer with legged-state
# estimation.  /go2/ground_truth_tf is deliberately NOT bridged: F5 owns the
# odom -> base_link edge and two publishers on that edge fail silently.
- ros_topic_name: "/demo/odom"
  gz_topic_name: "/go2/odom"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

- ros_topic_name: "/demo/scan"
  gz_topic_name: "/scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS

# O mesmo sensor, como nuvem de pontos, e este e o que serve para desviar de
# obstaculo.
#
# O L1_lidar do Go2 (go2_description/xacro/gazebo.xacro) e um gpu_lidar 3D: 640
# amostras horizontais em 200 graus por 16 aneis verticais em +-15 graus.
# sensor_msgs/LaserScan e 2D e nao tem onde guardar os aneis, entao a travessia
# acima entrega UM anel dos 16 -- os outros quinze sao descartados sem aviso.
#
# Medido em 20/08/2026: no mundo quadruped_objects.sdf, com quatro objetos de
# 0,30 a 0,80 m de altura plantados a 1,5-4,5 m a frente, o /demo/scan devolve
# 46 de 640 feixes validos com minimo de 4,82 m -- numericamente IDENTICO ao
# mundo vazio.  O anel exposto ve parede rente ao corpo e chao a 5-10 m, e nao ve
# objeto isolado a frente.  Um costmap alimentado por ele nao veria justamente o
# que o robo precisa desviar.
#
# O gpu_lidar publica os 16 aneis em <topic>/points como gz.msgs.PointCloudPacked,
# e a ros_gz_bridge tem conversao direta disso para sensor_msgs/PointCloud2.  Nao
# ha conversao de gz.msgs.LaserScan para PointCloud2, e por isso a fonte aqui e
# /scan/points e nao /scan.
#
# go2_description NAO pode ser editado para reapontar o sensor: o pacote e
# vendorizado com garantia byte-a-byte que sustenta o argumento de licenca (ver o
# README dele).  A bridge e o ponto de injecao que o projeto possui.
- ros_topic_name: "/demo/scan_cloud"
  gz_topic_name: "/scan/points"
  ros_type_name: "sensor_msgs/msg/PointCloud2"
  gz_type_name: "gz.msgs.PointCloudPacked"
  direction: GZ_TO_ROS
  # Nav2's PointCloud2 consumers (costmaps and collision_monitor) use the
  # standard sensor-data QoS: best-effort, volatile.  The bridge default is
  # reliable.  Both endpoints are formally compatible in that combination,
  # but on the Ethernet HIL the fragmented cloud stopped reaching those
  # best-effort readers after discovery; collision_monitor then rejected every
  # command because its source was stale.  Publish sensor data with the sensor
  # QoS expected by those consumers.  This is deliberately NOT applied to the
  # much larger camera image below: detection_stub uses reliable QoS for that
  # stream because 640x480 RGB samples were completely lost as best-effort
  # fragments on the same link.
  qos_profile: SENSOR_DATA

- ros_topic_name: "/demo/camera/image_raw"
  gz_topic_name: "/camera/image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "/demo/camera/camera_info"
  gz_topic_name: "/camera/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS

# The hardware interface consumes this same Gazebo IMU internally; exposing it
# keeps the simulator-side diagnostic contract aligned with the diff-drive.
- ros_topic_name: "/demo/imu"
  gz_topic_name: "/imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS
