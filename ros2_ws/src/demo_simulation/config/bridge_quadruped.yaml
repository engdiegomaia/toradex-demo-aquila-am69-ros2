# ROS <-> Gazebo boundary for the Go2 plant (ML3.5 F4).
# Runs on the x86 host only, in the sim container.

# The bridge publishes /clock DIRECTLY, with no intermediary. The opposite was
# already tried -- sending the raw clock to /demo/clock_raw and republishing it
# through a Python node (`clock_throttle`) to reduce load on the Aquila -- and
# was reverted on 21/08/2026: throttling the clock breaks navigation (the A/B
# is in the header of demo_simulation/clock_throttle.py). With the hop passed
# straight through, its cost fell WITHIN run-to-run noise (0.0202 with the hop,
# 0.0232 without, same configuration); it was removed for being a pass-through
# with no function, not for a measured cost. The node stays in the package,
# outside the default path.
#
# If you point this back at /demo/clock_raw without also bringing up
# clock_throttle, nothing publishes /clock: the simulation comes up, the robot
# stands, and no node with use_sim_time advances past time zero. Nothing in the
# log names the clock as the cause.
- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

# Temporary ground-truth odometry.  F5 replaces the producer with legged-state
# estimation.  /go2/ground_truth_tf is deliberately NOT bridged: F5 owns the
# odom -> base_link edge and two publishers on that edge fail silently.
- ros_topic_name: "/demo/odom"
  gz_topic_name: "/go2/odom"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

- ros_topic_name: "/demo/scan"
  gz_topic_name: "/scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS

# The same sensor, as a point cloud, and this is the one that is actually
# usable for obstacle avoidance.
#
# The Go2's L1 lidar (go2_description/xacro/gazebo.xacro) is a 3D gpu_lidar:
# 640 horizontal samples over 200 degrees by 16 vertical rings at +-15 degrees.
# sensor_msgs/LaserScan is 2D and has nowhere to store the rings, so the
# conversion above delivers ONE of the 16 rings -- the other fifteen are
# silently dropped.
#
# Measured on 20/08/2026: in the quadruped_objects.sdf world, with four
# objects 0.30 to 0.80 m tall placed 1.5-4.5 m ahead, /demo/scan returns 46 of
# 640 valid beams with a minimum of 4.82 m -- numerically IDENTICAL to the
# empty world. The exposed ring sees the wall hugging the body and the floor
# at 5-10 m, and does not see an isolated object ahead. A costmap fed by it
# would miss exactly what the robot needs to avoid.
#
# The gpu_lidar publishes all 16 rings on <topic>/points as
# gz.msgs.PointCloudPacked, and ros_gz_bridge has a direct conversion from
# that to sensor_msgs/PointCloud2. There is no conversion from
# gz.msgs.LaserScan to PointCloud2, which is why the source here is
# /scan/points and not /scan.
#
# go2_description CANNOT be edited to repoint the sensor: the package is
# vendored with a byte-for-byte guarantee that underpins its licensing
# argument (see its own README). The bridge is the injection point this
# project has.
- ros_topic_name: "/demo/scan_cloud"
  gz_topic_name: "/scan/points"
  ros_type_name: "sensor_msgs/msg/PointCloud2"
  gz_type_name: "gz.msgs.PointCloudPacked"
  direction: GZ_TO_ROS
  # Nav2's PointCloud2 consumers (costmaps and collision_monitor) use the
  # standard sensor-data QoS: best-effort, volatile.  The bridge default is
  # reliable.  Both endpoints are formally compatible in that combination,
  # but on the Ethernet HIL the fragmented cloud stopped reaching those
  # best-effort readers after discovery; collision_monitor then rejected every
  # command because its source was stale.  Publish sensor data with the sensor
  # QoS expected by those consumers.  This is deliberately NOT applied to the
  # much larger camera image below: detection_stub uses reliable QoS for that
  # stream because 640x480 RGB samples were completely lost as best-effort
  # fragments on the same link.
  qos_profile: SENSOR_DATA

- ros_topic_name: "/demo/camera/image_raw"
  gz_topic_name: "/camera/image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "/demo/camera/camera_info"
  gz_topic_name: "/camera/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS

# The hardware interface consumes this same Gazebo IMU internally; exposing it
# keeps the simulator-side diagnostic contract aligned with the diff-drive.
- ros_topic_name: "/demo/imu"
  gz_topic_name: "/imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS

# --- Cockpit scene cameras (blue panel, ML3.5 F3b) ---------------------------
#
# Two external views of the world, spawned by
# launch/scene_cameras.launch.py. They do not belong to the robot: they are
# the OPERATOR's camera, and exist to answer "did the robot move?" without
# depending on any node in the stack.
#
# Each one's camera_info is bridged for a reason that is NOT geometry: it is
# the panel's heartbeat. An <img> wired to a multipart/x-mixed-replace stream
# never fires `load` and reports complete=false while the stream is healthy
# (measured in Firefox on 24/08/2026), so the panel cannot tell from the
# element itself whether there is video. It decides based on the freshness of
# camera_info, which arrives at the same rate as the image and costs a few
# bytes. Without these two topics the blue panel shows "no signal" on top of
# video that is actually running.
#
# Deliberately without qos_profile: SENSOR_DATA. Same reasoning as the robot's
# camera image -- on the HIL Ethernet link, 800x600 RGB fragments were
# completely lost as best-effort. Reliable is the bridge's default.
- ros_topic_name: "/demo/cockpit/scene_iso/image_raw"
  gz_topic_name: "/cockpit/scene_iso/image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "/demo/cockpit/scene_iso/camera_info"
  gz_topic_name: "/cockpit/scene_iso/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS

- ros_topic_name: "/demo/cockpit/scene_top/image_raw"
  gz_topic_name: "/cockpit/scene_top/image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "/demo/cockpit/scene_top/camera_info"
  gz_topic_name: "/cockpit/scene_top/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS
