# slam_toolbox parameters for the live Go2 map used by the global costmap.
#
# This has to be a real params file, not an inline dict in the launch file:
# slam_toolbox declares its parameters from a params-file load, so inline
# launch parameters are silently dropped. The failure is quiet — the node
# starts, prints nothing, subscribes to the default /scan (which does not exist
# in this project's /demo namespace), and never publishes a map or map->odom.
#
# Values below are the slam_toolbox defaults except for the frame/topic names,
# which follow the project's topic contract, and `restamp_tf`, whose reason is
# documented at the parameter itself.
#
# Essa frase ja foi falsa uma vez: ate 28/08/2026 `map_update_interval` estava em
# 1.0 sob este cabecalho sem que o cabecalho dissesse. Naquele dia foi levado ao
# default 5.0 do upstream
# (`/opt/ros/jazzy/share/slam_toolbox/config/mapper_params_online_async.yaml:30`)
# e, no mesmo dia, devolvido a 1.0 -- porque a economia de CPU que justificava a
# mudanca foi medida e nao existia. Hoje 1.0 e de novo um DESVIO deliberado do
# upstream, e a razao esta no parametro.
# Se voce mudar um valor daqui, mude este paragrafo junto -- um cabecalho que
# mente custa mais que o parametro que ele descreve.

slam_toolbox:
  ros__parameters:
    use_sim_time: true

    # Project-specific — everything else on this list is upstream default.
    odom_frame: odom
    map_frame: map
    base_frame: base
    scan_topic: /demo/scan_slam
    mode: mapping

    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02
    # In HIL the scan crosses host -> Aquila before slam_toolbox consumes it.
    # Publishing map->odom with that older scan stamp leaves Nav2 asking for a
    # transform a few tenths of a second in the future and FollowPath aborts.
    # Keep the estimated transform itself, but stamp each broadcast with the
    # current simulation time so the distributed TF tree remains usable.
    restamp_tf: true

    # De volta ao default do upstream (5.0) em 28/08/2026. Estava em 1.0.
    #
    # O QUE ESTE PARAMETRO CONTROLA, E O QUE ELE NAO CONTROLA
    #
    # Controla o periodo com que o pose-graph e RASTERIZADO na grade de ocupacao
    # publicada em `/map`. NAO e a taxa de scan matching, NAO e a taxa de
    # fechamento de laco e NAO reduz a otimizacao do pose-graph: nenhuma dessas
    # passa por aqui. A pose do robo continua sendo estimada a cada scan, e
    # `map -> odom` continua saindo a `transform_publish_period` (0.02).
    #
    # O CUSTO FOI MEDIDO, E NAO ESTAVA AQUI
    #
    # O argumento para subir isto para 5.0 era que a rasterizacao percorre o
    # grafo inteiro, cresce com a area mapeada, e estava sendo paga 5x mais
    # vezes do que o upstream pratica -- CPU tirada do controller num modulo
    # arm64 ja saturado. O argumento e bom e a medicao o desmentiu:
    #
    #     async_slam_toolbox_node    31,4 %  ->  30,3 %     (1.0 -> 5.0)
    #     demo-nav-1 (total)        493,6 %  ->  481-494 %
    #     TF disponivel              78,11 % ->   79,13 %
    #
    # 1,1 ponto percentual, dentro do ruido (docs/results/ml35-f5-tf-cpu-
    # baseline.md secao 4). A CPU do slam_toolbox nao estava na rasterizacao; o
    # casamento de scans e onde ela esta, e ele roda a cada scan
    # independentemente deste parametro. O criterio do proprio plano era
    # "manter 5.0 somente se reduzir CPU sem piorar navegacao ou atualizacao do
    # mapa". Nao reduziu. Revertido.
    #
    # Para comparacao, o que de fato mexeu na CPU do modulo naquele dia foi
    # decimar o joint_state_broadcaster: carga media 26,9 -> 18,5, `async_slam`
    # 31,4 % -> 18,0 % (docs/results/ml35-f5-ab-joint-states.md). O gargalo era
    # entrega de mensagem, nao rasterizacao de grade.
    #
    # O QUE 1.0 COMPRA
    #
    # A `static_layer` do costmap global so enxerga o mapa quando ele e
    # publicado. Com 5.0 o costmap global pode ficar ate 5 s atras da parede que
    # o SLAM ja conhece -- 75 cm a 0,15 m/s. Com 1.0 esse atraso e de 15 cm.
    # Sem economia de CPU do outro lado da balanca, nao ha o que pesar contra.
    map_update_interval: 1.0
    resolution: 0.05
    min_laser_range: 0.12
    max_laser_range: 12.0
    minimum_time_interval: 0.5
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
    enable_interactive_mode: true

    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.2
    minimum_travel_heading: 0.2
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 3.0
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
