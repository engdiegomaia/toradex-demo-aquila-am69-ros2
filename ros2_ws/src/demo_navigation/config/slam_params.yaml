# slam_toolbox parameters for the live Go2 map used by the global costmap.
#
# This has to be a real params file, not an inline dict in the launch file:
# slam_toolbox declares its parameters from a params-file load, so inline
# launch parameters are silently dropped. The failure is quiet — the node
# starts, prints nothing, subscribes to the default /scan (which does not exist
# in this project's /demo namespace), and never publishes a map or map->odom.
#
# Values below are the slam_toolbox defaults except for the frame/topic names,
# which follow the project's topic contract, and `restamp_tf`, whose reason is
# documented at the parameter itself.
#
# That sentence has been false once before: until 28/08/2026 `map_update_interval`
# was at 1.0 under this header without the header saying so. That day it was
# taken to the upstream default of 5.0
# (`/opt/ros/jazzy/share/slam_toolbox/config/mapper_params_online_async.yaml:30`)
# and, the same day, put back to 1.0 -- because the CPU saving that justified
# the change was measured and did not exist. Today 1.0 is again a deliberate
# DEVIATION from upstream, and the reason is at the parameter.
# If you change a value here, change this paragraph too -- a header that lies
# costs more than the parameter it describes.

slam_toolbox:
  ros__parameters:
    use_sim_time: true

    # Project-specific — everything else on this list is upstream default.
    odom_frame: odom
    map_frame: map
    base_frame: base
    scan_topic: /demo/scan_slam
    mode: mapping

    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02
    # In HIL the scan crosses host -> Aquila before slam_toolbox consumes it.
    # Publishing map->odom with that older scan stamp leaves Nav2 asking for a
    # transform a few tenths of a second in the future and FollowPath aborts.
    # Keep the estimated transform itself, but stamp each broadcast with the
    # current simulation time so the distributed TF tree remains usable.
    restamp_tf: true

    # Back to the upstream default (5.0) on 28/08/2026. It was at 1.0.
    #
    # WHAT THIS PARAMETER CONTROLS, AND WHAT IT DOES NOT
    #
    # It controls the period at which the pose graph is RASTERIZED into the
    # occupancy grid published on `/map`. It is NOT the scan-matching rate, NOT
    # the loop-closure rate and does NOT reduce pose-graph optimization: none of
    # those go through here. The robot pose is still estimated on every scan,
    # and `map -> odom` is still published at `transform_publish_period` (0.02).
    #
    # THE COST WAS MEASURED, AND IT WAS NOT HERE
    #
    # The argument for raising this to 5.0 was that rasterization walks the whole
    # graph, grows with the mapped area, and was being paid 5x more often than
    # upstream does -- CPU taken from the controller on an arm64 module that is
    # already saturated. The argument is sound and the measurement refuted it:
    #
    #     async_slam_toolbox_node    31.4 %  ->  30.3 %     (1.0 -> 5.0)
    #     demo-nav-1 (total)        493.6 %  ->  481-494 %
    #     TF available               78.11 % ->   79.13 %
    #
    # 1.1 percentage points, within noise (docs/results/ml35-f5-tf-cpu-
    # baseline.md section 4). The slam_toolbox CPU was not in rasterization;
    # scan matching is where it is, and it runs on every scan regardless of this
    # parameter. The plan's own criterion was "keep 5.0 only if it reduces CPU
    # without worsening navigation or map updates". It did not reduce it.
    # Reverted.
    #
    # For comparison, what actually moved the module's CPU that day was
    # decimating the joint_state_broadcaster: mean load 26.9 -> 18.5, `async_slam`
    # 31.4 % -> 18.0 % (docs/results/ml35-f5-ab-joint-states.md). The bottleneck
    # was message delivery, not grid rasterization.
    #
    # WHAT 1.0 BUYS
    #
    # The global costmap's `static_layer` only sees the map when it is published.
    # With 5.0 the global costmap can lag up to 5 s behind a wall SLAM already
    # knows about -- 75 cm at 0.15 m/s. With 1.0 that lag is 15 cm. With no CPU
    # saving on the other side of the scale, there is nothing to weigh against.
    map_update_interval: 1.0
    resolution: 0.05
    min_laser_range: 0.12
    max_laser_range: 12.0
    minimum_time_interval: 0.5
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
    enable_interactive_mode: true

    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.2
    minimum_travel_heading: 0.2
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 3.0
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
