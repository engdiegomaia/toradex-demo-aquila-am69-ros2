# Nav2 parameters for the Go2 QUADRUPED (ML3.5 F5).
#
# Derived from nav2_params.yaml, which is the TurtleBot 4's and remains valid
# for the diff-drive robot. These are two robots with different envelopes; a
# single file does not serve both, and overwriting the TB4's would erase its
# tuning. The duplication is deliberate and is the price of keeping both paths
# alive.
#
# ALL deltas relative to the TB4 file are listed here, with the measurement
# that justifies them. If you change one, change the rationale along with it.
#
# ---------------------------------------------------------------------------
# 1. robot_base_frame: base_link -> base
#
# The Go2's URDF has no base_link. Measured on 20/08/2026: the tree is rooted
# at `base`, and `base` -> `trunk` -> {lidar, imu_link, front_camera, 4 legs}.
# go2_description is vendored with a byte-for-byte guarantee that backs the
# licensing argument (see its README), so the frame name is a given. This file
# is the one that yields, since it belongs to the project.
#
# 2. robot_radius: 0.18 (TB4) -> polygonal footprint [+/-0.37, +/-0.18] (Go2)
#
# The Go2's trunk is ~0.70 x 0.31 m. Until 29/08/2026 this file used
# `robot_radius: 0.38`, the CIRCUMSCRIBED radius (sqrt(0.35^2 + 0.155^2) =
# 0.383). Promoted in code to the real rectangular footprint, measured in
# `docs/results/ml35-f5-footprint-ab.md` as `nav2_params_go2_footprint.yaml` --
# see the note in the `footprint` block of each costmap below for the numbers
# and the HIL validation status. Do not shrink the footprint thinking it will
# fit through a narrower gap: the LEGS sweep outside the trunk during the
# trot, and a shape smaller than the trunk plans a path the leg does not fit
# through.
#
# 3. Obstacle source: /demo/scan (LaserScan) -> /demo/scan_cloud (PointCloud2)
#
# THIS IS THE DELTA THAT MAKES THE ROBOT DODGE. The Go2's L1_lidar is a 3D
# gpu_lidar with 640 x 16 rays; sensor_msgs/LaserScan is 2D and the crossing
# delivers ONE of the 16 rings.
#
# Measured on 20/08/2026, robot stationary at the origin of the
# quadruped_objects.sdf world, with four objects 0.30 to 0.80 m tall at
# 1.5-4.5 m ahead:
#
#   /demo/scan       (1 ring)   46 of 640 valid beams, ZERO obstacles --
#                               numerically identical to the empty world
#   /demo/scan_cloud (16 rings) 2097 points, 249 above the floor ahead,
#                               at 1.31-4.43 m: 15 on the box at ~1.5 m,
#                               190 on the pair at ~3.0 m, 44 on the cylinder
#                               at ~4.5 m
#
# In the corridor: 5749 points, 2422 obstacles starting at 1.06 m.
#
# min_obstacle_height exists to discard the floor. The 16 rings point
# downward: of the 2097 points, 1848 are floor. Without this filter the
# costmap fills up with the floor itself and the robot does not move. In the
# odom frame the floor sits at z ~ 0 and the obstacles between 0.05 and
# 0.80 m, hence the cutoff at 0.12 m.
#
# 4. Lidar ranges: 20.0/15.0/0.17 -> 9.0/8.0/0.10
#
# The L1 declares a range of 0.05-10.0 m (gazebo.xacro). raytrace above the
# real range makes the layer stop clearing cells that were never observed,
# and the obstacle stays frozen in the costmap. obstacle_max_range stays
# BELOW raytrace on purpose: mark conservatively, clear generously.
#
# 5. Velocity envelope: vx 0.5 -> 0.15, wz 1.9 -> 0.12
#
# This is not conservatism, it's the measured physical limit of the gait
# controller:
#
#   - 0.20 m/s is the ceiling of the stick clamp (twist_to_inputs); 0.10 m/s
#     is the validated point (docs/results/ml35-f4-parcial.md). 0.15 is the
#     midpoint, with margin.
#   - Below ~0.05 m/s the step becomes millimetric under an 8 cm foot-lift
#     and the robot marches in place and destabilizes -- hence there is a
#     minimum, not just a maximum.
#   - 0.13 rad/s is where the yaw moment of the balance QP SATURATES
#     (docs/results/ml35-caminhada-reta.md). Asking for more does not deliver
#     more: it drags the feet and falls. wz_max 0.12 sits just below it.
#   - vy_max stays 0.0 and motion_model stays "DiffDrive" even though the Go2
#     knows how to walk sideways. Strafe was measured (0.08-0.10 m/s) but
#     never under planning, and enabling holonomy without that measurement
#     would trade a known problem for an unknown one.
#
# 6. Accelerations: ax 2.0 -> 0.5, az 3.0 -> 0.8
#
# The gait controller's horizontal acceleration clamp is 3 m/s^2 and its yaw
# clamp is 10 rad/s^2, but those are the limits where it FALLS. A large
# command step becomes a force step requested from the QP.
#
# 7. collision_monitor: source "scan" -> "pointcloud" on the cloud
#
# Same reason as item 3: a collision monitor fed by the single ring does not
# see the obstacle and the emergency stop never triggers.
#
# 8. Local costmap window: 3 x 3 -> 6 x 6 m
#
# The L1 measures an obstacle at 4.43 m; a 3 m window only reveals the
# obstacle at 1.5 m and throws away the range the sensor already delivers.
#
# 9. Global costmap: rolling, with a static_layer fed by the live map
#
# slam_toolbox is the sole author of map -> odom and preserves free/occupied;
# the master window stays rolling so it does not shrink down to the first
# partial map.
#
# 10. inflation_radius: 0.35 -> 0.55
#
# Direct consequence of item 2, not an independent choice: inflation smaller
# than robot_radius (0.38) lets the planner trace a curve whose corner grazes
# the obstacle. 0.55 = 0.38 + 0.17 m of margin.
#
# 13. MPPI horizon: 56 x 0.05 s -> 96 x 0.1 s; batch 2000 -> 1000;
#     controller_frequency 20 -> 10
#
# THE DELTA THAT MAKES THE ROBOT MOVE. Horizon is measured in DISTANCE: 2.8 s
# cover 1.4 m on the TB4 and 0.42 m on the Go2, which does not reach the
# PathAlignCritic's own reference (weight 14, offset 20 points ~ 1 m). With
# the cost field nearly flat, the command comes out as noise around zero --
# measured, with a clean costmap.
#
# 12. progress_checker: 0.5 m/10 s -> 0.20 m/40 s
#
# Measured: the TB4 values produce 13 aborts in 5 min and no goal completed,
# with ZERO falls. Turning 90 degrees at 0.12 rad/s takes 13 s with no
# advance, so requiring 0.5 m in 10 s fails a maneuver the robot is executing
# correctly.
#
# 11. behavior_server: max_rotational_vel 1.5 -> 0.12
#
# The most dangerous delta to forget. Recoveries publish velocity DIRECTLY,
# without going through velocity_smoother or the MPPI limits, so items 5 and
# 6 do not cover them. At 1.5 rad/s the robot falls during recovery.
#
# ---------------------------------------------------------------------------
# NOT VALIDATED ON HARDWARE. Every number here comes from Gazebo Harmonic
# simulation on the x86 workstation. arm64 emulation does not measure
# performance (CLAUDE.md, rule 5).

# Nav2 parameters — ML3.
#
# Runs on: Aquila AM69 (arm64) in target mode, x86 host in learn mode.
# Identical file in both cases; nothing here is architecture-specific.
#
# Derived from the Nav2 Jazzy defaults, changed only where this robot differs:
#   - topics live in the /demo namespace (topic contract, CLAUDE.md)
#   - robot_base_frame is `base` (the Go2's URDF has no base_link)
#   - the obstacle source is the 3D cloud, not the single-ring LaserScan
#   - footprint and velocity limits are the Go2's, measured
#   - both costmaps have a perception layer fed by demo_perception
#
# WHO PUBLISHES EACH TF EDGE ON THIS PATH:
#
#   map -> odom    demo_bringup/odom_tf with publish_map_identity:=true (identity)
#   odom -> base   demo_bringup/odom_tf from /demo/odom
#   base -> ...    robot_state_publisher, from the vendored URDF
#
# The amcl below ALSO publishes map -> odom (tf_broadcast: true). The two
# together give two publishers on the same edge, and that does NOT error out:
# the consumer receives both and uses whichever arrived last, alternating
# between two beliefs of where the robot is. Hence: for reactive avoidance,
# bring up odom_tf and do NOT bring up amcl; to navigate over a saved map,
# bring up amcl and set publish_map_identity:=false.
# Never both with identity enabled.
#
# The velocity limits here are the gait controller's PHYSICAL ceiling, not a
# preference. Asking above them does not go faster: above ~0.13 rad/s the yaw
# moment saturates in the balance QP, the robot drags its feet and falls.
# This reads like a controller tuning problem, and it is not one.
#
# Keep parameters here, never in code — project convention.

amcl:
  ros__parameters:
    use_sim_time: true
    base_frame_id: "base"
    odom_frame_id: "odom"
    global_frame_id: "map"
    scan_topic: /demo/scan
    # Publishes map -> odom. The only owner of that TF edge.
    tf_broadcast: true
    transform_tolerance: 1.0
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 12.0
    laser_min_range: 0.12
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    update_min_a: 0.2
    update_min_d: 0.25
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    set_initial_pose: true
    # Must agree with the spawn pose in simulation.launch.py, or AMCL starts
    # the particle cloud in the wrong place and the first goal fails.
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base
    odom_topic: /demo/odom
    bt_loop_duration: 10
    # ============ MEASURED ON THE AQUILA AM69, NOT ON THE HOST (21/08/2026) ============
    #
    # 20 ms is the Nav2 default and works on the x86 host. On the module it
    # does NOT work, and the failure does not look like a timeout: every goal
    # is ACCEPTED and fails in 4-9 s, and the robot does not move. What the
    # module's log says is:
    #
    #   Timed out while waiting for action server to acknowledge goal request
    #     for compute_path_to_pose
    #   Timed out while waiting for action server to acknowledge goal request
    #     for smooth_path
    #   Failed to cancel action server for follow_path
    #
    # `bt_navigator` cannot reach its OWN sibling servers, all in the same
    # container, on the same machine. It is not network between host and
    # module: it is the round-trip cost of an rclcpp action on a Cortex-A72
    # with CycloneDDS at AllowMulticast=false and explicit peers, which
    # exceeds 20 ms.
    #
    # This is a LATENCY observation on real hardware, which rule 5 allows --
    # it forbids concluding performance from EMULATION. Do not extrapolate
    # from here to another module or to a different DDS configuration.
    #
    # 200 ms gives an order of magnitude of margin and does not delay anything
    # in steady state: it is a wait deadline, not a period. The 10 ms
    # `bt_loop_duration` does not change.
    default_server_timeout: 200
    # Initial service discovery. The 1000 ms default assumes all servers are
    # already up; on the module the Nav2's 13 processes come up together and
    # compete for 8 cores, and whichever tries first may not find its
    # neighbor yet.
    wait_for_service_timeout: 5000
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    # Tree with SmoothPath. The value here is a PLACEHOLDER:
    # `nav_quadruped.launch.py` rewrites this key with the absolute path in
    # share/, via RewrittenYaml. The key needs to EXIST in this file to be
    # rewritten -- nav2_common's RewrittenYaml substitutes a key it finds, and
    # does not add a new key.
    #
    # No tree shipped with Nav2 Jazzy calls SmoothPath, so without this swap
    # the `smoother_server` below stays active and idle, and the MPPI chases
    # NavFn's raw staircase. See the header of
    # behavior_trees/nav_to_pose_smoothed.xml.
    default_nav_to_pose_bt_xml: "SUBSTITUIDO_PELO_LAUNCH"
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"

controller_server:
  ros__parameters:
    use_sim_time: true
    # 10 Hz, not 20. At 0.15 m/s the robot travels 1.5 cm per cycle at 10 Hz,
    # which is resolution to spare, and the MPPI with model_dt 0.1 wants the
    # loop at 10 Hz -- the two have to match. Measured at 20 Hz: "Control loop
    # missed its desired rate of 20.0000 Hz. Current loop rate is 12.0482 Hz."
    controller_frequency: 10.0
    odom_topic: /demo/odom
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      # THE TB4 VALUES (0.5 m in 10 s) ABORT EVERY GOAL ON THIS ROBOT.
      #
      # Measured on 20/08/2026, quadruped_objects.sdf world: 13 occurrences of
      # "Failed to make progress" in ~5 min, the first 10 s after the first
      # goal, and goal 1 never completed. Zero falls -- the robot was fine, it
      # was the checker that was failing it.
      #
      # The arithmetic: the Go2 turns at a ceiling of 0.12 rad/s (yaw-moment
      # saturation in the balance QP). Reorienting 90 degrees takes 13 s, and
      # in those 13 s the advance is nearly zero because the MPPI spends its
      # whole authority on yaw. Requiring 0.5 m in 10 s is therefore requiring
      # something the robot's physics forbids whenever the goal is not
      # already ahead.
      #
      # 0.20 m in 40 s almost never triggers: in R5+R6 it caught 2 of 9 lost
      # goals and gave back 29 s. A fixed per-goal deadline also does not
      # solve it -- lowering `goal_timeout_s` from 90 to 45 merely doubled
      # the number of expirations (3x90 = 6x45 = 270 s across the two runs),
      # because a deadline measures elapsed time, not progress.
      #
      # Sized by simulating the SimpleProgressChecker over the recorded poses
      # from R5+R6 (2 Hz, 45 goals). The deadline dominates; the radius
      # matters little between 0.25 and 0.40:
      #
      #   radius deadline  lost goals caught   time given back   good aborts
      #   0.20   40 s          2/9                    29 s               0
      #   0.30   25 s          6/9                   107 s               0
      #   0.20   20 s          7/9                   188 s               1
      #   0.50   10 s          9/9                   427 s               9  <-- Nav2 default
      #
      # 25 s is the knee: below that it starts failing good goals. The Nav2
      # default (0.5 m in 10 s) would abort ALL 9 successful goals -- the
      # measurement that confirms the paragraph above about the 0.12 rad/s
      # yaw.
      required_movement_radius: 0.30
      movement_time_allowance: 25.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      # 0.5 rad (28.6 degrees), not 0.25. At a ceiling of 0.12 rad/s, closing
      # the last 14 degrees takes 2 s of stationary turning -- and turning in
      # place does NOT stay in place: measured on 20/08/2026, the robot
      # drifted 0.78 m in y while turning to satisfy orientation and left the
      # POSITION tolerance, which was already satisfied at 3.8 cm. The goal
      # failed on deadline after having arrived.
      #
      # On a patrol, final orientation serves no purpose; what matters is
      # arriving. 28.6 degrees is still a heading constraint, but it does not
      # pay for a stationary turn to satisfy it.
      yaw_goal_tolerance: 0.5
      stateful: true

    # MPPI (Model Predictive Path Integral), replacing DWB.
    #
    # WHY THE SWAP:
    # DWB scores a fixed lattice of constant-curvature arcs. On a diff-drive robot
    # in narrow warehouse aisles that produces two visible artefacts: it hunts
    # between neighbouring samples (the robot wobbles down a straight aisle), and
    # it cannot represent a manoeuvre that needs the velocity to change sign
    # mid-trajectory, so tight corners degrade into stop-rotate-go.
    #
    # MPPI samples 2000 noisy trajectories per cycle and takes a cost-weighted
    # average, so the command is continuous rather than snapped to a lattice
    # sample. It handles the aisle case far better and is the current Nav2
    # recommendation for diff-drive.
    #
    # COST: MPPI is significantly heavier than DWB. It is fine on the x86 host
    # (learn mode). On the Aquila AM69 in target mode this is the single most
    # expensive node in the stack, and whether 20 Hz holds there CANNOT be
    # answered from this file, from learn mode, or from arm64 emulation
    # (CLAUDE.md rule 5 — emulation does not measure performance). It must be
    # measured on the real module. If it does not hold, drop batch_size to 1000
    # before lowering controller_frequency; halving the batch costs less accuracy
    # than halving the control rate.
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      # HORIZON IS MEASURED IN DISTANCE, NOT IN TIME. This is the delta that
      # makes the robot move, and the easiest one to get wrong by copying
      # from the TB4.
      #
      # 56 x 0.05 = 2.8 s. On the TB4, at 0.5 m/s, that covers 1.4 m. On the
      # Go2, at 0.15 m/s, it covers 0.42 m -- 30% of the lookahead, with the
      # SAME numbers.
      #
      # 0.42 m does not reach the critics' own references: PathAlignCritic
      # has weight 14 (the highest of all) and seeks a reference
      # `offset_from_furthest` = 20 path points ahead, ~1 m; PathFollowCritic
      # seeks 5 points. The dominant critic does not reach its own reference,
      # and what remains is a nearly flat cost field: the weighted average of
      # the samples tends to zero and the command comes out as NOISE around
      # zero.
      #
      # Measured on 20/08/2026 with 56 x 0.05, costmap verifiably clean
      # (cost 0 at the robot's cell, 0 within 0.6 m): in 300 s the robot
      # walked 4.16 m of path for 0.73 m of net displacement, `cmd_vx`
      # between -0.100 and +0.040 with 39% of samples NEGATIVE, and turned to
      # 97 degrees when the requested heading was 20.6. Zero falls -- the
      # robot was fine, the command was not.
      #
      # 96 x 0.1 = 9.6 s = 1.44 m at 0.15 m/s, equivalent to the horizon the
      # TB4 has in distance. Sampling cost: 1000 x 96 = 96k points against
      # 2000 x 56 = 112k, i.e. LESS than before.
      # A/B FROM 25/08/2026 (night), RUN ON THE REAL AM69: 64 x 0.15 FAILED
      # ITS OWN CRITERION. The default values below are the baseline.
      #
      # The hypothesis was to cut Nav2 CPU without shortening the horizon:
      # horizon is time_steps x model_dt (9.6 s in both cases) and cost is
      # batch_size x time_steps (96k -> 64k points, 33% less sampling).
      #
      # MEASURED, and the result kills the hypothesis: the `nav` container's
      # CPU stood at ~439% against ~437% of the previous run. Thirty-three
      # percent fewer sampling points did NOT reduce CPU. The MPPI's cost
      # here is not dominated by batch_size x time_steps, contrary to what
      # the COST comment above assumes. Whoever attacks Nav2 CPU again:
      # start by measuring WHERE it is spent, not by touching this pair.
      #
      # The run's other metrics came out better (0.0353 m/s, work ratio
      # 6.7%, `vx` zeroed at 75.7% against 85-92%), and even so that does
      # NOT support adopting it: two runs on the previous IDENTICAL
      # configuration gave 0.0109 and 0.0265 m/s, a 2.4x spread. The noise
      # between runs is larger than the effect one wants to measure, so n=1
      # decides nothing here.
      #
      # This stays documented and OUTSIDE the default, the same policy as
      # the /clock throttling node. To resume, change the two values below
      # to 64 / 0.15 and run n>=3 PER CONDITION -- see
      # docs/results/ml35-f5-mppi-amostragem.md.
      time_steps: 96
      model_dt: 0.1
      batch_size: 1000
      # Sampling spread. vx/wz must be wide enough to explore useful manoeuvres
      # but not so wide that most samples are immediately rejected as invalid.
      vx_std: 0.06
      vy_std: 0.0
      # 0.15, raised from 0.08 (which itself came from 0.05). Rotation is
      # only a real alternative to reversing if the sampler actually explores
      # it: with wz_std 0.05 against a wz_max of 0.20, the sample cloud
      # barely reaches the new ceiling.
      #
      # The 0.08 was in the right direction and WAS NOT ENOUGH. Measured on
      # HIL on 27/08/2026 (`docs/results/ml35-f5-slam-exploration.md`), a
      # 19-goal, 240 s route:
      #
      #   median signed cmd_wz             +0.01344 rad/s  (6.7% of wz_max 0.20)
      #   integrated command turn          +184.7 degrees
      #   robot's REAL turn                  -2.4 degrees  (yaw 90.0 -> 87.6)
      #
      # The MPPI commands a turn in the right direction and the plant does
      # not turn: 0.0134 rad/s divided by WZ_PER_STICK (0.5) reaches the gait
      # supervisor as 0.027 stick units, 5.4% of STICK_CLAMP. With the
      # heading locked at ~88 degrees of error, `vx` STAYS at zero -- the
      # alignment critics do not reward advancing perpendicular to the plan,
      # and vx_min: 0.0 forbids reversing. The robot walked 0.06 m in 240 s
      # and completed 0 of 7 goals.
      wz_std: 0.15
      # HARD CEILING: upstream's DiffDrive plugin clamps to 0.5 m/s and
      # 2.0 rad/s. Raising these makes MPPI plan trajectories the simulator
      # silently refuses to execute, which looks like a tracking bug.
      vx_max: 0.15
      #
      # ======================= WHY vx_min IS ZERO =======================
      #
      # It used to be -0.10, and that produced a DEADLOCK, measured in maze11
      # on 21/08/2026.
      #
      # The chain: in a 1.20 m corridor the PathAlignCritic (weight 14, the
      # highest) finds it optimal to reverse to realign; the robot reverses;
      # it hits the wall behind it; and reversing STAYS optimal, because the
      # geometry that made it optimal has not changed. The robot ends up
      # commanding reverse against the wall indefinitely.
      #
      # Measured with sensor_check.py, a 20 s window: `/demo/cmd_vel_si` with
      # vx < 0 in 100% of samples, and the robot walked 0.00 m in 25 s. In
      # the 180 s runs before that, 11% to 62% of samples were negative and
      # the command's MEAN was ~zero (-0.011 to +0.017 m/s).
      #
      # It was not the sensor. In the same window: odom identical to TF
      # (error 0.0000 m), scan_cloud at 9.9 Hz, odom at 49.8 Hz, and the
      # nearby returns fit d/cos(theta-theta0) of a straight wall at 0.372 m
      # -- no lidar self-collision. The defect was one of DECISION, and the
      # wrong decision only existed because reverse was there to sample.
      #
      # With 0.0 the MPPI cannot sample reverse: to correct heading it needs
      # to TURN, which is what this robot should do. A true backup is still
      # possible -- the behavior_server's `backup` publishes cmd_vel directly
      # and does not go through these limits -- so a dead end still has a way
      # out.
      vx_min: 0.0
      vy_max: 0.0
      # 0.20, raised from 0.12. The 0.12 was sized with k_yaw = 0.25, when the
      # yaw axis lived at the stop (yawSat peaking at 90-94%). With k_yaw 0.35
      # the measured peak dropped to 70%, i.e. headroom appeared -- and
      # forbidding reverse without giving turning authority would trade one
      # lockup for another. Still well below the plugin's 2.0 rad/s clamp.
      wz_max: 0.20
      ax_max: 0.5
      ax_min: -0.5
      az_max: 0.8
      # 2, raised from 1. With a single iteration per cycle the control
      # sequence starts from the previous result (~zero) and can only move by
      # a fraction of a standard deviation per cycle -- and a larger `wz_std`
      # alone does not fix this, because the problem is how many times the
      # mean is re-evaluated, not the width of the cloud. Both levers are
      # raised together on purpose.
      #
      # PREDICTED COST THAT DID NOT MATERIALIZE. The prediction was that
      # doubling the iteration count would double the optimizer's cost, with
      # a trigger to revert to 1 below ~5 Hz. Measured in the
      # `controller_server` logs (`docs/results/ml35-f5-slam-giro.md` §4):
      #
      #                      iteration_count: 1   iteration_count: 2
      #   median rate                7.58 Hz              8.13 Hz
      #   minimum rate                4.65 Hz              4.00 Hz
      #
      # THE MEDIAN WENT UP. The loop was already not closing the nominal
      # 10 Hz before the change, so the rate loss on the AM69 does not come
      # from the optimizer and this parameter is NOT the culprit. Do not
      # revert to 1 based on a low rate without first finding the real
      # cause -- which remains open.
      iteration_count: 2
      prune_distance: 1.7
      transform_tolerance: 0.2
      temperature: 0.3
      gamma: 0.015
      # DiffDrive, NOT Omni: this robot cannot strafe. Declaring Omni here lets
      # MPPI sample lateral velocities the robot cannot execute, and it then
      # tracks a path it can never follow.
      motion_model: "DiffDrive"
      visualize: false
      regenerate_noises: true

      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3

      # Critic names verified against libmppi_critics.so — a misspelled critic is
      # not loaded and no error is printed, it simply stops contributing.
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic",
                "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic",
                "PathAngleCritic", "PreferForwardCritic"]

      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0

      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4

      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5

      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5

      # CostCritic reads the costmap directly. Preferred over ObstaclesCritic
      # for this demo because it reads the inflation layer's gradient as well
      # as (now, see `consider_footprint` below) the real footprint polygon,
      # instead of ObstaclesCritic's own separate collision model.
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        # Promoted to true on 30/08/2026: in simulation (host, amd64) the
        # robot grazed side walls in narrow corridors with
        # `consider_footprint: false`. With false the critic samples the
        # cost of the cell at the trajectory's POINT and trusts the
        # inflation gradient (0.55 local / 0.85 global) as margin -- but the
        # gradient was calibrated on the CIRCUMSCRIBED radius (0.411 m), and
        # the sampled point sits at the trunk's center, not at the
        # rectangle's corner. In a turn along a wall, the corner reaches
        # beyond what that radius covers while the center point still reads
        # low cost -- the critic approves the trajectory and the corner
        # still grazes the real obstacle the lidar had already marked in the
        # costmap.
        #
        # true makes the critic check the real polygon against the costmap's
        # cells (which carry the lidar's obstacle via `obstacle_layer`, not
        # an odometry-based estimate) instead of a single point plus fixed
        # margin -- and that polygon can only be used safely because both
        # costmaps already publish `footprint` (rectangle), not
        # `robot_radius` (circle). Before the footprint's promotion in code,
        # both costmaps declared `robot_radius` and never published a
        # polygon, so the critic dereferenced an empty one and the entire
        # `nav2_container` died with SIGSEGV a few ms after
        # "Created controller : MPPIController" (Nav2 warns beforehand --
        # "Inconsistent configuration in collision checking. Please verify
        # the robot's shape settings in both the costmap and the cost
        # critic" -- and only then crashes; the warning is the only clue,
        # and it does not name this parameter). That crash precondition no
        # longer holds.
        #
        # Measured only in simulation so far -- still missing the HIL run on
        # the Aquila confirming that the same margin gain holds under the
        # real dynamics of the trot (simulation does not measure hardware
        # performance, only collision geometry; see CLAUDE.md rule 5).
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 1.0

      PathAlignCritic:
        enabled: true
        cost_power: 1
        # 14.0. TRIED 7.0 in R14b (30/08/2026, confounded by process) AND in
        # R14c (30/08/2026, isolated retest against the pre-R15 code) --
        # REVERTED in both. R14c is the reading that counts (single variable
        # of truth): against the same "genuine straight corridor" subset
        # (docs/results/ml35-f5-exploration-r14c.md), median `cmd_wz`
        # (0.048 rad/s) and yaw amplitude/5s (median 10.2 degrees) came out
        # slightly BETTER than the R13 baseline (0.056 rad/s, 10.7 degrees),
        # and the wall asymmetry returned to R13's level (median 0.25 m, 45%
        # left/31% right/25% center -- a distribution nearly identical to
        # R13's, not the fixed 57% bias that R14b measured under the
        # process error). This indicates that R14b's severe bias was not an
        # isolated effect of cost_weight -- it does not prove the cause was
        # specifically the R15 code bundled with it (different maze geometry
        # each run, n=1 per configuration); R15's real contribution remains
        # open until the integrated validation in R16.
        #
        # But `plan_straightness` got worse (fraction below 0.9: 12.4% ->
        # 31.7%), the run had MORE stillness windows than any previous run
        # (7 against 5 in R13), and the goal completion rate dropped (70% ->
        # 52%, 11/21). Mixed result: marginal improvement in smoothness
        # metrics, worse mission indicators. Not a clear enough win to
        # justify deviating from the baseline with n=1 per configuration --
        # reverted for the same reason as R14/R14b: do not stack an
        # unproven change. Two attempts on the same dominant critic
        # (offset_from_furthest, cost_weight) with no clear net gain; the
        # next step is not a third MPPI weight, see the recommendation in
        # docs/results/ml35-f5-exploration-r14c.md.
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        # 20. TRIED 10 in R14 (30/08/2026) and REVERTED -- measured, it did
        # not help. The hypothesis (R13,
        # docs/results/ml35-f5-exploration-r13.md): oscillation of the
        # dominant critic (weight 14, the highest) around a FAR reference
        # (offset 20 ~ 1 m) suggested shortening to ~0.5 m (offset 10) made
        # sense.
        #
        # Measured on real HIL (docs/results/ml35-f5-exploration-r14.md),
        # same "genuine straight corridor" subset as R13: median `cmd_wz`
        # WENT UP (0.052 -> 0.079 rad/s), `plan_straightness` got worse
        # (fraction below 0.9: 12.4% -> 39.1%), real yaw amplitude per 5 s
        # window got worse (median 10.7 -> 16.9 degrees), and the wall
        # asymmetry switched from "oscillates 50/50" to "fixed bias to the
        # left" (63% left) -- not the pattern the hypothesis predicted had
        # it worked. Goal completion rate also dropped (70% -> 56%), though
        # confounded by different exploration geometry between the two runs
        # (n=1 on each side). Zero falls in both.
        #
        # Reverted so as not to stack an unproven change under the next
        # A/B on the MPPI side -- still open: PathAlignCritic weight,
        # PathAngleCritic weight, or the active plan's replacement frequency
        # (docs/ml35/estado-fases.md, R14).
        offset_from_furthest: 20
        use_path_orientations: false

      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4

      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base
      rolling_window: true
      # 6 x 6, not 3 x 3 (the TB4's value). The 3 m window centered on the
      # robot has a 1.5 m radius, and the L1 measures an obstacle at 4.43 m
      # (measured in quadruped_objects.sdf). At 3 m the robot only sees the
      # box once it is at 1.5 m; at the 0.15 m/s envelope that gives 10 s of
      # warning, but the dodge starts late and comes out abrupt. 6 m uses the
      # range the sensor already delivers.
      #
      # The cost is memory and CPU: the grid grows with the square of the
      # side. 6/0.05 = 120 x 120 cells, which is cheap. Do not raise this to
      # 20: updating a large grid at 5 Hz is what tends to blow the CPU
      # budget on the module.
      width: 6
      height: 6
      resolution: 0.05
      # POLYGONAL FOOTPRINT, PROMOTED IN CODE ON 29/08/2026; FINAL HIL PENDING.
      #
      # Replaces the circumscribed circle (`robot_radius: 0.38`, sqrt(0.35^2 +
      # 0.155^2) = 0.383) with the trunk's real rectangle (0.70 x 0.31 m,
      # with 0.02 m of margin per side). What actually changes is the
      # INSCRIBED radius, which drops from 0.38 to 0.18: the 253 band
      # (INSCRIBED_INFLATED_OBSTACLE) shrinks in the same proportion.
      # Footprint's circumscribed radius: sqrt(0.37^2 + 0.18^2) = 0.411,
      # still below both costmaps' inflation_radius (0.55 and 0.85), so the
      # rule "inflation cannot be smaller than the footprint" still holds.
      #
      # Measured in `docs/results/ml35-f5-footprint-ab.md`: a 150 s HIL A/B,
      # the only variable being the robot's shape. Median/maximum cost at
      # the robot's own cell dropped from 168/243 (circle) to 135/165
      # (polygon), and the fraction of samples at the fatal 253 threshold
      # dropped from 7.1% to 0.0%. Not promoted earlier for lack of
      # measurement; the promotion in code still awaits an HIL run
      # confirming the same margin gain under the default.
      footprint: "[ [0.37, 0.18], [0.37, -0.18], [-0.37, -0.18], [-0.37, 0.18] ]"
      # perception_layer sits between obstacles and inflation so that
      # detections are inflated like any other obstacle.
      plugins: ["obstacle_layer", "perception_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: cloud
        cloud:
          topic: /demo/scan_cloud
          data_type: "PointCloud2"
          min_obstacle_height: 0.12
          max_obstacle_height: 1.0
          clearing: true
          marking: true
          # Ranges must not exceed the sensor's real reach or the layer stops
          # clearing cells it never actually observed, leaving stale obstacles
          # frozen in the costmap. The Go2's L1_lidar declares a range of
          # 0.05-10.0 m (go2_description/xacro/gazebo.xacro); check with
          # `gz topic -e -t /scan/points -n 1`. 9.0 stays within that.
          #
          # obstacle_max_range stays BELOW raytrace_max_range on purpose: mark
          # obstacles conservatively, clear freespace generously.
          raytrace_max_range: 9.0
          raytrace_min_range: 0.0
          obstacle_max_range: 8.0
          # Above the L1's 0.05 m minimum. Returns closer than that are a
          # measurement artefact, and marking them plants an obstacle inside
          # the robot's own footprint, which triggers recovery for no
          # reason. The front leg enters the lidar's field during the trot:
          # 0.10 m is what keeps the leg out of the costmap.
          obstacle_min_range: 0.10

      # The perception -> costmap seam required by CLAUDE.md. Fed by
      # demo_perception's detections_to_cloud adapter, so detections steer
      # the robot instead of only decorating the HMI.
      #
      # `clearing: true` since 25/08/2026. The previous text here said that
      # `clearing: false` was deliberate, because "letting the stub's coarse
      # projection clear cells would erase real lidar obstacles". The fear
      # points at the wrong mechanism: each ObstacleLayer has its OWN grid
      # and enters the master via `combination_method` = Max, which is
      # nav2's default (`cost_values.hpp`: "default to maximum", `Max = 1`).
      # The master ends up with `max(obstacle_layer_wall, 0)` = the wall. A
      # bad projection here has no way to erase what the lidar saw.
      #
      # What `clearing: false` actually did was make this layer's marks
      # PERMANENT -- see the measurement in the `detections` block below.
      perception_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: detections
        detections:
          topic: /demo/perception/detection_cloud
          # 1.0 m covers the column the adapter writes with margin to spare:
          # it emits z from 0.0 to `obstacle_height_m`, whose default is
          # 0.3 m (detections_to_cloud.py). If you raise that parameter
          # above 1.0, raise this ceiling along with it or the column's top
          # is silently discarded.
          max_obstacle_height: 1.0
          min_obstacle_height: 0.0
          # `clearing: true` since 25/08/2026. Used to be `false`, and
          # `false` makes this layer's marks PERMANENT -- the
          # `observation_persistence` below empties the observation buffer,
          # not the cells that were already written. The comment that
          # accompanied the parameter described the right intent ("expire
          # them rather than accumulating") and the value delivered the
          # opposite.
          #
          # Measured at the bench, x86 host, maze11, with perception ALREADY
          # STOPPED for about a minute (`docker compose stop perception`):
          #
          #   costmap probe, before clearing : 169 lethal cells, 0.10 m free lane
          #   after /demo/nav/reset          : 108 lethal cells, 0.15 m free lane
          #
          # In other words: 61 lethal cells that no live observation
          # sustained, and that only left through explicit clearing. In a
          # 1.20 m corridor with `robot_radius: 0.38` that is the difference
          # between having and not having a path. In a long demo, it is a
          # monotonic degradation: the longer it runs, the less navigable
          # costmap, with no log saying so.
          #
          # Each ObstacleLayer has its own costmap and enters the master via
          # Max (`combination_method` default), so clearing here does NOT
          # erase the walls seen by `obstacle_layer`.
          #
          # The same applies to TIDL: a detected obstacle that left the
          # field of view has to be able to leave the costmap. This is
          # costmap tuning, not perception contract -- the topic and the
          # type do not change (CLAUDE.md, topic contract).
          clearing: true
          marking: true
          data_type: "PointCloud2"
          obstacle_max_range: 5.0
          obstacle_min_range: 0.0
          raytrace_max_range: 5.0
          raytrace_min_range: 0.0
          # Detections go stale fast; expire them rather than accumulating a
          # trail of phantom obstacles behind the robot.
          observation_persistence: 1.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # 3.0 is a shallow decay that keeps mid-range cells expensive. Raised to
        # 5.0 so cost falls off faster with distance, letting the planner commit
        # to the centre of a free aisle instead of treating most of it as costly.
        cost_scaling_factor: 5.0
        # 0.55 here is NOT the 0.55 that the TB4 file rejected. There it was
        # more than 3x the 0.18 radius and it closed the warehouse aisle;
        # here it is the 0.38 radius plus 0.17 m of margin, the same margin
        # the TB4 ended up using.
        #
        # The floor is robot_radius itself: inflation smaller than the
        # footprint lets the planner trace a curve whose corner grazes the
        # obstacle. With robot_radius 0.38 the old value of 0.35 violated
        # this — hence it was raised.
        inflation_radius: 0.55

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true

      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base
      # Same polygon as the local costmap — see the note there.
      footprint: "[ [0.37, 0.18], [0.37, -0.18], [-0.37, -0.18], [-0.37, 0.18] ]"
      # 10 cm, and NOT the local costmap's 5 cm. See the window block below:
      # the two changed together and one without the other is the bad case.
      resolution: 0.10
      # slam_toolbox accumulates both occupied and free space. static_layer
      # projects that memory inside the window, which stays rolling.
      #
      # DO NOT use false with the live map: StaticLayer resizes the master
      # costmap to the minimal rectangle published by SLAM. Measured on HIL
      # on 27/08/2026, the first map had 78x32 cells and left the footprint
      # at the edge; the planner tried my=32/33 and repeated
      # `worldToMap failed`. Rolling keeps the window centered on the robot
      # while overlaying whatever part of the pose-graph falls inside it.
      #
      # THE WINDOW IS 40 m AND THE RESOLUTION IS 10 cm -- CHANGED TOGETHER, 28/08/2026
      #
      #   before   20 / 0.05 = 400 cells per axis, covering +/- 10 m from the robot
      #   after    40 / 0.10 = 400 cells per axis, covering +/- 20 m from the robot
      #
      # The master grid stays at ~160 thousand cells, so inflation, raytrace
      # and publishing cost the same as before. Raising the window WITHOUT
      # lowering the resolution would give 800x800 = 640 thousand cells, 4x
      # the cost, on the same module that has already lost CPU to SLAM and
      # to the explorer. Do not do only half of it.
      #
      # WHY 20 m WAS NOT ENOUGH: the poses of `quadruped_maze11.sdf` give a
      # maze of x -11.67..0.00 by y -2.60..11.65, i.e. ~11.7 x 14.2 m,
      # DIAGONAL ~18.4 m. With the robot in one corner, the opposite corner
      # sits at ~18 m and simply DOES NOT EXIST in the master grid -- not
      # for the cockpit panel, which draws `/global_costmap/costmap`
      # (hmi/js/panels/nav-panel.js), nor for the planner. It was not the
      # map being forgotten; it was the window cutting it off. +/- 20 m
      # covers the entire diagonal from any point of the maze.
      #
      # 10 cm on the GLOBAL costmap does not loosen collision handling:
      # close-range avoidance is decided by the local costmap, which stays
      # at 5 cm on purpose. This costmap's `inflation_radius` is 0.85 (0.55
      # is the local one's), which at 10 cm per cell still gives 8.5 cells
      # of inflation -- generous for `robot_radius` 0.38.
      #
      # IF static_layer DOES NOT REPROJECT BETWEEN 5 cm AND 10 cm: the SLAM
      # map comes out at 0.05 (slam_params.yaml) and here the master is at
      # 0.10. On the ROLLING path StaticLayer keeps its own grid and
      # transforms cell by cell into the master, so different resolutions
      # should pass through -- but this was NOT verified on hardware. If the
      # walls do not appear, revert ONLY these three lines (20 / 20 / 0.05).
      # Do not switch to `rolling_window: false` at the same time: that
      # brings back the 27/08 defect.
      rolling_window: true
      width: 40
      height: 40
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "perception_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        subscribe_to_updates: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: cloud
        cloud:
          topic: /demo/scan_cloud
          data_type: "PointCloud2"
          min_obstacle_height: 0.12
          max_obstacle_height: 1.0
          # ====== DO NOT SET `false` HERE. TRIED, MEASURED, REJECTED. ======
          #
          # The idea was to give the global map MEMORY: a wall seen once
          # never disappears again, and the robot stops rediscovering the
          # maze every second.
          #
          # THE DEFECT IT WAS ATTACKING is real, measured on HIL on
          # 27/08/2026 reading /plan every 5 s on a goal stuck at
          # (0,0) -> (0,8):
          #
          #   t+ 5s   458 pts, 11.49 m, initial heading 173 deg   <- TRUE route
          #   t+10s   458 pts, 11.50 m, initial heading 177 deg
          #   t+15s   291 pts,  8.59 m, initial heading  89 deg   <- CUTS THROUGH wall
          #   t+25s   274 pts,  8.66 m, initial heading  35 deg
          #   t+30s   271 pts,  8.81 m, initial heading  18 deg
          #
          # The 11.5 m matches maze11's real geodesic measured offline
          # (12.23 m, `tools/maze/maze_geodesic.py`). The 8.6 m is the
          # straight line through an unobserved wall, which only exists
          # because `allow_unknown: true` makes the unknown cheap.
          #
          # The plan alternates between the two at 1 Hz. The MPPI receives a
          # path that flips 90-180 degrees every second -- which turns
          # without translating, the symptom that sections 7 to 10 of
          # `docs/ml35/proximos-passos-navegacao.md` chased as if it were a
          # critic defect.
          #
          # WHY `false` DOES NOT FIX IT, measured on the same day, on the
          # same HIL:
          #
          #   net displacement       0.19 m -> 1.04 m   (improved)
          #   vx work ratio            0.0% -> 3.9%     (improved)
          #   goals completed             0 -> 0        (unchanged)
          #   plan still alternates  11.66 m <-> 8.77 m (unchanged)
          #
          # And reading `/global_costmap/costmap_raw` along the straight
          # line to the goal, with `false` enabled: **150 of 161 cells at
          # 255 (UNKNOWN)**, everything beyond 0.75 m.
          #
          # The reason lies in the parameter's semantics, and it is
          # counter-intuitive: `clearing` is NOT "forget obstacle", it is
          # the raytrace -- and the raytrace is the ONLY mechanism that
          # turns unknown into FREE in this layer. Turning it off, nothing
          # ever becomes free and the global map stays permanently unknown
          # outside the marked cells. Since NavFn runs with
          # `allow_unknown: true`, this makes the shortcut through the
          # unknown MORE attractive, not less. The fix makes the cause it
          # attacks worse.
          #
          # WHAT ACTUALLY FIXES IT needs to persist BOTH things -- occupied
          # and free -- and the obstacle layer does not know how to do
          # that. It is the SLAM map (`slam_toolbox`) feeding the
          # `static_layer` above, with `allow_unknown: true` kept so that a
          # distant goal remains plannable. See
          # docs/results/ml35-f5-memoria-costmap.md.
          clearing: true
          marking: true
          # Within the L1's real 10 m range — see the note in the local costmap.
          raytrace_max_range: 9.0
          raytrace_min_range: 0.0
          obstacle_max_range: 8.0
          obstacle_min_range: 0.10

      perception_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: detections
        detections:
          topic: /demo/perception/detection_cloud
          # 1.0 m covers the column the adapter writes with margin to spare:
          # it emits z from 0.0 to `obstacle_height_m`, whose default is
          # 0.3 m (detections_to_cloud.py). If you raise that parameter
          # above 1.0, raise this ceiling along with it or the column's top
          # is silently discarded.
          max_obstacle_height: 1.0
          min_obstacle_height: 0.0
          # Same as the global costmap, and for the same measured reason:
          # `false` left a permanent mark. The two costmaps have to match --
          # planning on a map that clears while controlling on one that
          # does not clear yields a valid route with the controller
          # refusing to follow it, with no error at all.
          clearing: true
          marking: true
          data_type: "PointCloud2"
          obstacle_max_range: 5.0
          obstacle_min_range: 0.0
          raytrace_max_range: 5.0
          raytrace_min_range: 0.0
          observation_persistence: 1.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # Divergent inflation between the two costmaps is a classic case of
        # "the global plan goes where the local one refuses to follow": the
        # planner routes through a corridor the local costmap considers
        # blocked, and the robot gets stuck in the middle of the gap.
        #
        # THIS ONLY HOLDS IN ONE DIRECTION, which is why these values now
        # DIVERGE from the local one (0.55 / 5.0) on purpose:
        #
        #   global MORE conservative than local  -> safe. The global path
        #     always falls on terrain the local one accepts. That is the
        #     case here.
        #   global LESS conservative than local -> the defect described
        #     above.
        #
        # WHY DIVERGE: this is how "prefer the route with more free space"
        # is expressed with NavFn, which is pure Dijkstra over the costmap's
        # cost and has no dedicated margin term. With inflation_radius 0.55
        # in a 1.20 m corridor, the ZERO-cost band in the middle is 0.10 m
        # (1.20 - 2*0.55): outside that strip the cost is flat, and Dijkstra
        # picks by LENGTH, ignoring margin. With 0.85 > 0.60 (the
        # corridor's half-width) there is no longer a zero-cost cell in the
        # corridor, the gradient is monotonic all the way to the center, and
        # a tight route ends up costing more than an open one.
        #
        # cost_scaling_factor drops from 5.0 to 2.0 so the gradient is smooth
        # across the 0.85 m; at 5.0 it decays fast and goes back to nearly
        # flat in the outer half, which is the problem being fixed.
        #
        # What does NOT change: the INSCRIBED band, which is what the
        # planner treats as an obstacle, comes from `robot_radius` (0.38)
        # and not from inflation_radius. Raising the inflation therefore
        # does NOT close any corridor -- it only reorders preference among
        # routes that all remain viable.
        cost_scaling_factor: 2.0
        inflation_radius: 0.85

      always_send_full_costmap: true

map_server:
  ros__parameters:
    use_sim_time: true
    # Overridden at launch by the `map` argument.
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: true
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true

planner_server:
  ros__parameters:
    use_sim_time: true
    # 1.0, not the Nav2 stock 20.0.
    #
    # This value does NOT make the planner faster — it only sets the rate that
    # triggers "Planner loop missed its desired rate of 20.0000 Hz. Current loop
    # rate is 1.0225 Hz" warnings. NavFn over a 477x475 costmap takes ~1 s per
    # plan on this machine, so 20 Hz was never achievable and the log filled with
    # warnings about a target nothing had asked for.
    #
    # The BT replans on its own cadence anyway; a global plan once per second is
    # ample for a 0.5 m/s robot. Raise this only if you also make planning
    # cheaper (Smac Planner, coarser costmap resolution).
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased", "ExplorationGrid"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      # Goal snapping radius when the exact goal cell is unreachable.
      #
      # NOTE: tolerance does NOT rescue a goal placed in UNKNOWN space. 55% of
      # warehouse.pgm is unknown (value 205) because SLAM only mapped the aisles
      # the robot drove through. A goal there fails with
      #     "Failed to create a plan from potential when a legal potential was
      #      found. This shouldn't happen."
      # which reads like an internal planner bug and is not one — there is simply
      # no free-space corridor to the goal. Verify a goal before blaming tuning:
      #     see docs/analise-sensores-navegacao.md ("Metas em espaco desconhecido")
      tolerance: 0.5
      use_astar: false
      # Lets the planner traverse unknown cells it can still reach. It does not
      # help when the goal AND its whole neighbourhood are unknown.
      allow_unknown: true
    # Frontier goals are always placed in observed free space.  This second
    # planner prevents a valid candidate from taking a shortcut through cells
    # the live SLAM map has not observed yet.
    ExplorationGrid:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.25
      use_astar: false
      allow_unknown: false

# =========================== route_server ============================
#
# This demo does NOT use graph-based routing. The section exists for one
# reason only: to prevent `ReroutingService` from being constructed.
#
# THE DEFECT IT WORKS AROUND
#
# `route_server` is in the vendored `navigation_launch.py`'s `lifecycle_nodes`
# list, which has to stay identical to upstream (provenance -- see
# launch/nav2_vendored/README.md), and that list reaches lifecycle_manager as
# a parameter HARDCODED in the launch: `{'node_names': lifecycle_nodes}`. An
# inline value beats the parameter file, so there is NO way to remove
# route_server from the list here. It will be configured, whether we want it
# or not.
#
# And configuring `ReroutingService` brings down the ENTIRE process with
# SIGSEGV:
#
#   [route_server]: Configuring Rerouting service operation.
#   [ERROR] [component_container_isolated-4]: process has died
#           [pid 40, exit code -11, ...]
#
# `-11` is SIGSEGV. Measured on 24 and 25/08/2026, on three distinct paths:
# RESET+STARTUP via lifecycle_manager, and **normal cold start** -- the
# latter INTERMITTENTLY, which is the worst case: the same command comes up
# fine once and brings down the stack the next time, and the symptom is
# "Nav2 didn't come up today".
#
# When this happens, `nav2_container` dies and with it ALL of Nav2's servers
# at once. The `nav` container ends up with the `ros2` process alive and no
# children, so `docker compose ps` says "running" and the robot does not
# navigate. Nothing in the compose state flags it.
#
# `operations` is the list of route-operation plugins. The default includes
# `ReroutingService`; listing only `AdjustSpeedLimit` makes the problematic
# plugin never get constructed. Do NOT set `[]`: an empty YAML list reaches
# the launch as a Python tuple and brings everything down with "Expected
# 'value' to be one of [float, int, str, bool, bytes], but got '()'" -- see
# trap 5 of the operations guide.
#
# This is a WORKAROUND, not a fix: the cause lies in nav2_route and is a
# candidate for an upstream issue. If the demo ever needs routing, the plugin
# comes back and the defect comes back with it.
route_server:
  ros__parameters:
    # The list needs the TYPE of each plugin declared alongside it. While it
    # comes from the default, nav2_route knows its own defaults' types; the
    # moment it is overridden here, it starts requiring `<name>.plugin` and
    # fails the transition with a message that does not say which parameter
    # is missing:
    #
    #   [FATAL] [route_server]: Can not get 'plugin' param value for AdjustSpeedLimit
    #   [FATAL] [route_server]: Failed to configure route server: No 'plugin' param for param ns!
    #   [ERROR] [lifecycle_manager_navigation]: Failed to bring up all requested nodes.
    #
    # This is a HIGH-severity failure, and in that respect it is better than
    # the segfault it replaces: the manager aborts the bring-up, no server is
    # left half-alive, and the container does not lie "running" with Nav2
    # dead inside.
    operations: ["AdjustSpeedLimit"]
    AdjustSpeedLimit:
      plugin: "nav2_route::AdjustSpeedLimit"

smoother_server:
  ros__parameters:
    use_sim_time: true
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    local_frame: odom
    global_frame: map
    robot_base_frame: base
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    # THIS BLOCK CAUSES A FALL if left at the TB4's value.
    #
    # These are the velocities recoveries use, and they do NOT go through
    # velocity_smoother or the MPPI limits: behavior_server publishes
    # directly. At 1.5 rad/s the `spin` behavior asks for more than ten
    # times the measured limit of 0.13 rad/s, the yaw moment saturates in
    # the balance QP, the robot drags its feet and falls — and it falls
    # precisely during a recovery, which makes it look like the recovery
    # itself is broken.
    #
    # min_rotational_vel also has to come down: 0.4 alone already exceeds
    # the limit, and a minimum above the maximum makes the turn never
    # converge.
    max_rotational_vel: 0.12
    min_rotational_vel: 0.05
    rotational_acc_lim: 0.8

waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    # THESE THREE HAVE TO MATCH THE MPPI (vx_max/vx_min/wz_max above). The
    # smoother is the LAST step before collision_monitor: if it clips lower
    # than the MPPI, the clip does not show up in any log -- the controller
    # plans with one ceiling and the robot executes another, and the symptom
    # is "I changed the parameter and nothing happened".
    #
    # min_velocity[0] = 0.0 for the same reason as vx_min: without this the
    # smoother would still let through reverse coming from any other
    # source.
    max_velocity: [0.15, 0.0, 0.20]
    min_velocity: [0.0, 0.0, -0.20]
    max_accel: [0.5, 0.0, 0.8]
    max_decel: [-0.5, 0.0, -0.8]
    odom_topic: "/demo/odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

# Nav2 Jazzy's default bringup includes docking_server, and it FAILS TO
# CONFIGURE unless dock_plugins is set — which aborts the entire lifecycle
# bringup, leaving planner/controller/bt_navigator stuck in `inactive` with
# only map_server and amcl active. The demo has no charging dock, so this is
# the minimal configuration that lets the node reach active and stay out of
# the way. Remove it only together with docking_server itself.
docking_server:
  ros__parameters:
    use_sim_time: true
    # `docks` is intentionally absent, not set to []. An empty YAML list
    # reaches launch as a Python tuple, which is not a valid parameter type,
    # and the whole launch aborts with "Expected 'value' to be one of
    # [float, int, str, bool, bytes], but got '()'".
    dock_plugins: ["dummy_dock"]
    dummy_dock:
      plugin: "opennav_docking::SimpleChargingDock"

collision_monitor:
  ros__parameters:
    use_sim_time: true
    base_frame_id: "base"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    # SI units, NOT stick -- which is why the topic is a different one.
    #
    # /demo/cmd_vel carries normalized stick position, not m/s: the gait
    # controller multiplies linear.x by 0.4 and angular.z by 0.5 on receipt
    # (StateTrotting.cpp:192 with invNormalize, and twist_to_inputs.py:283
    # with unit gain). Every commander in the project divides by the gain
    # before publishing; demo_routine does this in to_twist.
    #
    # Nav2 cannot do this on output, because the MPPI INTEGRATES vx as m/s to
    # predict where the robot will be. Publishing raw stick here, every
    # rollout misjudges distance by 2.5x -- measured: vx_max 0.15 read as
    # stick delivers 0.006 m/s real and no goal fits the deadline.
    #
    # So Nav2 publishes SI units and demo_bringup/cmd_vel_si_to_stick
    # converts. Wiring this back into /demo/cmd_vel makes the robot walk at
    # 40% of what was requested with NO ERROR AT ALL in the log.
    cmd_vel_out_topic: "/demo/cmd_vel_si"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: true
    stop_pub_timeout: 2.0
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/local_costmap/published_footprint"
      # Give the collision monitor a little more time to brake/stop the Go2
      # when the full point-cloud lidar reports a wall ahead. This is a safety
      # margin only; it does not alter the MPPI path or its velocity limits.
      time_before_collision: 1.5
      simulation_time_step: 0.1
      min_points: 6
      visualize: false
      enabled: true
    observation_sources: ["cloud"]
    cloud:
      type: "pointcloud"
      topic: /demo/scan_cloud
      min_height: 0.12
      max_height: 1.0
      enabled: true
