# Compose for the x86 HOST side.
#
# Compose files are split by MACHINE, not by mode. Modes are selected by profiles
# and by which file you invoke on which machine:
#
#   learn  — everything here:      docker compose -f compose.host.yml --profile learn up --build
#   hil    — plant + viz here:     docker compose -f compose.host.yml up sim viz
#            nav + perception on the module (compose.module.yml)
#
# The web cockpit (`cockpit` + `hmi`) is outside the learn profile because it is
# wanted in both modes. Add it to either command:
#   docker compose -f compose.host.yml up -d cockpit hmi
# then open http://localhost:8081 (COCKPIT_HMI_PORT).
#
# nav and perception sit behind the `learn` profile so that in hil mode they
# simply do not start here — no file editing, which is what makes the two modes
# the same source tree.
#
# First run:
#   cp .env.example .env
#   xhost +local:docker
---
# Anchor for everything that only needs the ROS 2 / DDS contract.
#
# network_mode: host for every service. This makes inter-container DDS discovery
# work with no extra configuration and avoids the whole class of DDS-behind-a-NAT
# bridge failures (guia §5). It also means ports are not published or mapped —
# the containers are on the host's network stack directly.
x-common: &common
  environment: &common-env
    # Must match the module. A mismatch is silent (guia §5).
    ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-69}
    # CLAUDE.md rule 2. Also baked into the base image as ENV; repeated here so
    # that reading this file tells you what the RMW is without opening a
    # Dockerfile. The two must never disagree.
    RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
    CYCLONEDDS_URI: file:///cfg/cyclonedds.xml
    HOST_IP: ${HOST_IP:-}
    MODULE_IP: ${MODULE_IP:-}
  network_mode: host
  # host.rendered.xml, NOT host.xml. The committed file lists only 127.0.0.1
  # as a peer, and with AllowMulticast=false that gives discovery inside the
  # host and NO discovery of the module. The rendered file is generated by
  # `scripts/module.sh sync` with the module's address and this host's
  # interface, and is not versioned -- addresses do not go into git (CLAUDE.md
  # conventions).
  #
  # If the file does not exist, Compose creates a DIRECTORY with that name in
  # place of the bind mount and CycloneDDS fails to read the config. Run
  # `module.sh sync` before the first `up`.
  volumes:
    - ./cyclonedds/host.rendered.xml:/cfg/cyclonedds.xml:ro

services:
  # --- Plant: Gazebo + robot + bridge --------------------------------------
  # x86 host only, always. Never gets an arm64 build (CLAUDE.md rule 1).
  sim:
    <<: *common
    image: ${REGISTRY:-local}/demo-aquila-sim:${TAG:-dev}
    build:
      context: ..
      dockerfile: docker/sim/Dockerfile
      network: host
      args:
        REGISTRY: ${REGISTRY:-local}
        TAG: ${TAG:-dev}
    platform: linux/amd64
    depends_on:
      base:
        condition: service_completed_successfully
    environment:
      <<: *common-env
      DISPLAY: ${DISPLAY:-:0}
      # Gazebo needs a writable home for ~/.gz; the image sets this up for uid
      # 1000, and QT_X11_NO_MITSHM avoids a shared-memory failure that shows up
      # as a blank Gazebo window rather than an error.
      QT_X11_NO_MITSHM: 1
      # Where Gazebo resolves `model://` URIs that are not in the image. Always
      # set, and it costs nothing when the mount below is the empty default: a
      # resource path with no models behaves exactly like no resource path.
      GZ_SIM_RESOURCE_PATH: /maze/models
    volumes:
      - ./cyclonedds/host.rendered.xml:/cfg/cyclonedds.xml:ro
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # External model trees, for worlds whose meshes are not versioned here —
      # today only the labyrinth (ros_maze_worlds, whose package.xml declares
      # <license>TODO</license>).
      #
      # The default is an EMPTY directory in the repo, not an unset variable:
      # Compose has no conditional mount, and an unset default would make it
      # create a directory named after the variable. See models-extra/README.md.
      #
      # A missing mesh is a WARNING in Gazebo, never an error: the world loads,
      # the labyrinth simply is not there, and the run looks like flawless
      # obstacle avoidance in an open field.
      - ${MAZE_MODELS:-./models-extra}:/maze/models:ro
    # Intel/AMD: /dev/dri is enough. For NVIDIA, remove this and use
    # `gpus: all` with the nvidia-container-toolkit installed (guia §6).
    devices:
      - /dev/dri:/dev/dri
    # Mapping the device is NOT sufficient on its own. /dev/dri/renderD* is owned
    # by the host's `render` group, and the container's `ubuntu` user is in
    # `video` but not in that gid — so Gazebo logs
    #   libEGL warning: failed to open /dev/dri/renderD128: Permission denied
    # and silently falls back to software rendering. The demo still runs, just
    # slowly, which is the hard kind of problem to notice.
    #
    # RENDER_GID is host-specific (992 here). Find yours with:
    #   getent group render | cut -d: -f3
    # and set it in .env. Verified: with the gid the device is readable, without
    # it the open fails.
    group_add:
      - "${RENDER_GID:-992}"
    # Gazebo's rendering uses shared memory; the 64 MB default causes crashes
    # under load that do not name shm as the cause.
    shm_size: 512mb
    ipc: host
    # NO SIM_ARGS IS NEEDED FOR THE OFFICIAL SCENARIO.
    #
    # The maze is the quadruped's default world, and the spawn pose and the
    # framing of the two scene cameras come with it
    # (demo_simulation/scenarios.py). All that is left is to point at the
    # external meshes:
    #
    #   MAZE_MODELS=/path/to/ros_maze_worlds/models \
    #   docker compose -f compose.host.yml up -d sim
    #
    # Without MAZE_MODELS the launch ABORTS naming the variable. It used to
    # bring up an empty plane, and a trial on that plane ends SUCCEEDED faster
    # than reality -- see models-extra/README.md.
    #
    # This block used to carry a six-line SIM_ARGS with the ten maze numbers
    # pasted by hand. It was the FOURTH copy of them, and the one nobody
    # updated: pasting half the block gave the maze world with the warehouse
    # camera, which points the blue panel at empty floor with no error at all.
    # The numbers now live in one place and are indexed by world.
    #
    # SIM_ARGS remains the escape hatch for DEVIATIONS from the scenario, and
    # stays free-form on purpose. Any argument overrides the table:
    #
    #   SIM_ARGS="scene_top_z:=20.0"        # look at the maze from higher up
    #   SIM_ARGS="world:=/ws/install/demo_simulation/share/demo_simulation/worlds/quadruped_empty.sdf"
    #
    # Undeclared arguments pass through sim.launch.py to the launches it
    # includes without error (verified 24/08/2026).
    command: >
      ros2 launch demo_bringup sim.launch.py
      robot_type:=${ROBOT_TYPE:-quadruped}
      gui:=${SIM_GUI:-true}
      ${SIM_ARGS:-}

  # --- Navigation ----------------------------------------------------------
  # learn profile only. In hil mode this runs on the module instead.
  nav:
    <<: *common
    image: ${REGISTRY:-local}/demo-aquila-nav:${TAG:-dev}
    build:
      context: ..
      dockerfile: docker/nav/Dockerfile
      network: host
      args:
        REGISTRY: ${REGISTRY:-local}
        TAG: ${TAG:-dev}
    platform: linux/amd64
    depends_on:
      base:
        condition: service_completed_successfully
    profiles: ["learn"]
    # Ordering is NOT done here with depends_on on sim. `depends_on` waits for
    # the container to start, not for the warehouse world to finish loading, so
    # it would give false confidence. nav.launch.py gates on /clock actually
    # advancing instead — see demo_bringup/wait_for_clock.py.
    # The same ROBOT_TYPE selects both the plant above and its matching Nav2
    # stack. Selecting only the plant is a silent mixed-stack failure: both
    # launches are valid, but their frames, maps and velocity units differ.
    command: >
      ros2 launch demo_bringup nav_select.launch.py
      robot_type:=${ROBOT_TYPE:-quadruped}
      use_sim_time:=true
      params_override:=${NAV2_PARAMS:-__robot_default__}

  # --- Perception ----------------------------------------------------------
  perception:
    <<: *common
    image: ${REGISTRY:-local}/demo-aquila-perception:${TAG:-dev}
    build:
      context: ..
      dockerfile: docker/perception/Dockerfile
      network: host
      args:
        REGISTRY: ${REGISTRY:-local}
        TAG: ${TAG:-dev}
    platform: linux/amd64
    depends_on:
      base:
        condition: service_completed_successfully
    profiles: ["learn"]
    command: ros2 launch demo_bringup perception.launch.py use_sim_time:=true

  # --- Visualization -------------------------------------------------------
  # x86 host only, always (CLAUDE.md rule 1). Not in the learn profile: it is
  # wanted in hil mode too, where it watches the module's Nav2 over DDS.
  viz:
    <<: *common
    image: ${REGISTRY:-local}/demo-aquila-viz:${TAG:-dev}
    build:
      context: ..
      dockerfile: docker/viz/Dockerfile
      network: host
      args:
        REGISTRY: ${REGISTRY:-local}
        TAG: ${TAG:-dev}
    platform: linux/amd64
    depends_on:
      base:
        condition: service_completed_successfully
    environment:
      <<: *common-env
      DISPLAY: ${DISPLAY:-:0}
      QT_X11_NO_MITSHM: 1
    volumes:
      - ./cyclonedds/host.rendered.xml:/cfg/cyclonedds.xml:ro
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    devices:
      - /dev/dri:/dev/dri
    # Same reason as sim: without the host's render gid, RViz2 falls back to
    # software GL instead of failing outright.
    group_add:
      - "${RENDER_GID:-992}"
    ipc: host
    command: ros2 launch demo_bringup viz.launch.py

  # --- Cockpit transport ---------------------------------------------------
  # rosbridge_server + web_video_server. Pure transport: no OGRE 2, no desktop
  # OpenGL, so unlike viz this image is allowed on the module and the same
  # service definition moves to compose.module.yml in M3 without edits.
  #
  # Not behind a profile: the cockpit is wanted in learn AND hil. In hil you
  # name it explicitly, like sim and viz:
  #   docker compose -f compose.host.yml up sim viz cockpit hmi
  cockpit:
    <<: *common
    image: ${REGISTRY:-local}/demo-aquila-cockpit:${TAG:-dev}
    build:
      context: ..
      dockerfile: docker/cockpit/Dockerfile
      network: host
      args:
        REGISTRY: ${REGISTRY:-local}
        TAG: ${TAG:-dev}
    platform: linux/amd64
    depends_on:
      base:
        condition: service_completed_successfully
    # No /clock gate, for the same reason viz has none: these are transport
    # processes with no control loop. They come up empty and fill in, which is
    # visible on screen, rather than blocking the cockpit until Gazebo loads.
    command: >
      ros2 launch demo_bringup cockpit.launch.py
      rosbridge_port:=${COCKPIT_ROSBRIDGE_PORT:-9090}
      video_port:=${COCKPIT_VIDEO_PORT:-8080}

  # --- Cockpit bundle ------------------------------------------------------
  # nginx serving hmi/. Separate from `cockpit` so a CSS change does not rebuild
  # a 1.3 GB ROS image, and so the bundle can be baked into a Chromium kiosk
  # image for the module later without dragging rosbridge along.
  #
  # No ROS environment: this container never speaks DDS. It still inherits
  # network_mode: host from the anchor, which is why COCKPIT_HMI_PORT binds
  # straight onto the workstation and must be overridable.
  hmi:
    image: ${REGISTRY:-local}/demo-aquila-hmi:${TAG:-dev}
    build:
      context: ..
      dockerfile: docker/hmi/Dockerfile
      network: host
    platform: linux/amd64
    network_mode: host
    environment:
      COCKPIT_HMI_PORT: ${COCKPIT_HMI_PORT:-8081}
      COCKPIT_ROSBRIDGE_PORT: ${COCKPIT_ROSBRIDGE_PORT:-9090}
      COCKPIT_VIDEO_PORT: ${COCKPIT_VIDEO_PORT:-8080}
      # Empty means "the hostname the browser used to load the page". Keep it
      # empty for the workstation and for the module kiosk alike; set it only
      # when the page is served from a different machine than the ROS side.
      COCKPIT_BACKEND_HOST: ${COCKPIT_BACKEND_HOST:-}
      # Build identifier required by AGENTS.md §5.7. Defaults to the tag; CI or
      # the operator can pass a git describe instead.
      COCKPIT_BUILD: ${COCKPIT_BUILD:-${TAG:-dev}}

  # --- Tools ---------------------------------------------------------------
  # Inspection shell. Under its own profile so it does not start with the demo:
  #   docker compose -f compose.host.yml --profile tools up -d tools
  #   docker compose -f compose.host.yml exec tools bash
  tools:
    <<: *common
    image: ${REGISTRY:-local}/demo-aquila-tools:${TAG:-dev}
    build:
      context: ..
      dockerfile: docker/tools/Dockerfile
      network: host
      args:
        REGISTRY: ${REGISTRY:-local}
        TAG: ${TAG:-dev}
    platform: linux/amd64
    depends_on:
      base:
        condition: service_completed_successfully
    profiles: ["tools"]
    stdin_open: true
    tty: true
    # A service-level `volumes:` REPLACES the one `*common` carries (YAML merge
    # keys do not merge list values), so the cyclonedds mount is repeated here.
    #
    # artifacts/ (gitignored) is where the evaluation recorders write, e.g.
    # `python3 - artifacts/run1.csv < tools/evaluation/exploration_trial.py`.
    # Without this mount the recorder holds an entire HIL round in memory and
    # then fails on the final write with FileNotFoundError, losing every sample.
    volumes:
      - ./cyclonedds/host.rendered.xml:/cfg/cyclonedds.xml:ro
      - ../artifacts:/ws/artifacts
    # Must not exit — this service exists to be exec'd into (guia §9 uses
    # `compose exec tools`). The Dockerfile CMD already sleeps; stated here so
    # the behaviour is visible from the compose file.
    command: sleep infinity

  # --- Base image builder --------------------------------------------------
  # Not a running service. The five role images all start FROM
  # ${REGISTRY}/demo-aquila-base:${TAG}, and Compose has no notion of an image
  # dependency between builds — so without this, `up --build` fails on a clean
  # machine with "pull access denied for local/demo-aquila-base".
  #
  # `command: true` exits 0 immediately; the role services depend on it with
  # service_completed_successfully, which makes Compose build this image first
  # and then proceed. It is a build ordering device, not a workload.
  base:
    image: ${REGISTRY:-local}/demo-aquila-base:${TAG:-dev}
    build:
      context: ..
      dockerfile: docker/base/Dockerfile
      network: host
    platform: linux/amd64
    network_mode: host
    command: "true"
