# Compose for the Aquila AM69 MODULE side (arm64, Torizon OS).
#
# Runs the half of the demo that migrates to the module. Used for:
#
#   hil     — nav + perception here, sim + viz on the x86 host. The ML3.5 deliverable.
#   deploy  — nav + perception + hw, no host. Out of ML3.5 scope.
#
# ROBOT_TYPE selects the same navigation stack used by the host plant. HIL
# normally uses quadruped (the default); diffdrive remains the F6 fallback.
#
# NOTHING GRAPHICAL IS HERE, BY CONSTRUCTION.
# No sim, no viz, no X11 socket, no /dev/dri. The AM69 exposes only OpenGL ES 3.2
# and Vulkan 1.2, so Gazebo and RViz2 (both OGRE 2) cannot run on it — CLAUDE.md
# rule 1. Do not add them to this file. The guard is also in the sim and viz
# Dockerfiles, deliberately duplicated, because a compose file is the easiest
# thing to copy and edit by hand at 2am.
#
# Getting it here (guia §9):
#   scp compose.module.yml .env cyclonedds/module.xml torizon@${MODULE_IP}:~/demo/
#   ssh torizon@${MODULE_IP}
#   cd ~/demo && docker compose -f compose.module.yml up -d
#
# Validated on the Aquila AM69 on 21/08/2026 with the quadruped Nav2 stack. See
# docs/results/ml35-hil-aquila.md. Thermals and the Ethernet camera path remain
# unmeasured and must not be inferred from that result.
---
x-common: &common
  environment: &common-env
    # MUST match the host. A mismatch produces an empty `ros2 topic list` with
    # no error on either side — check this first when the link looks dead.
    ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-69}
    RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
    CYCLONEDDS_URI: file:///cfg/cyclonedds.xml
    HOST_IP: ${HOST_IP:-}
    MODULE_IP: ${MODULE_IP:-}
  network_mode: host
  # The module is meant to come up with the demo running after a power cycle.
  # Note this differs from the host side, where a crashed container should stay
  # down and visible rather than silently restarting during development.
  restart: unless-stopped
  volumes:
    - ./cyclonedds/module.xml:/cfg/cyclonedds.xml:ro
    # Config do Nav2 vinda da arvore SINCRONIZADA, nao da copia embutida na
    # imagem. Sem isto, mudar uma linha de YAML custa um `module.sh build`
    # inteiro no modulo -- foi o que travou a campanha A/B da secao 3 de
    # `docs/ml35/proximos-passos-navegacao.md`.
    #
    # O caminho de destino e o ALVO FINAL do symlink que o colcon instala, e nao
    # o caminho instalado. Verificado no container em 27/08/2026:
    #
    #   /ws/install/demo_navigation/share/demo_navigation/config/<f>.yaml
    #     -> /ws/build/demo_navigation/config/<f>.yaml
    #     -> /ws/src/demo_navigation/config/<f>.yaml
    #
    # Montar sobre o caminho instalado nao funcionaria: ele e um symlink, e o
    # que o Nav2 abre e o alvo. `tests/test_module_params_mount.py` trava os
    # dois lados desse contrato.
    #
    # NAO ha risco de a montagem mascarar um rebuild: `module.sh build` constroi
    # a imagem A PARTIR da mesma arvore sincronizada, entao montagem e imagem
    # saem sempre do mesmo arquivo. O que ela remove e a obrigacao de rebuildar.
    - ./ros2_ws/src/demo_navigation/config:/ws/src/demo_navigation/config:ro

services:
  nav:
    <<: *common
    image: ${REGISTRY:-local}/demo-aquila-nav:${TAG:-dev}
    platform: linux/arm64
    # use_sim_time:=true even here. In hil mode the module follows the HOST's
    # /clock over DDS, because Gazebo owns time. A module on wall time while the
    # host runs sim time gives TF extrapolation errors and Nav2 refusing goals,
    # with nothing in the logs pointing at the clock (guia §6).
    #
    # `nav_select.launch.py` couples ROBOT_TYPE to the matching Nav2 launch.
    # Selecting only one side is silent: both launches start, but the robot does
    # not navigate because frames, maps and command units do not match.
    #
    #   nav.launch.py           mapa estatico + AMCL, parametros nav2_params.yaml
    #                           (que sao do TurtleBot 4), robot_base_frame
    #                           `base_link` -- frame que o URDF do Go2 NAO tem.
    #   nav_quadruped.launch.py sem mapa e sem AMCL, nav2_params_go2.yaml,
    #                           robot_base_frame `base`, mais os dois nos que o
    #                           quadrupede exige: `odom_tf`, que fecha a TF, e
    #                           `cmd_vel_si_to_stick`, que converte SI para
    #                           manche -- sem ele o robo anda a 40% do pedido.
    #
    # Este launch e tambem quem carrega a arvore de comportamento com SmoothPath
    # (ver docs/results/ml35-navegacao-maze11.md).
    command: >
      ros2 launch demo_bringup nav_select.launch.py
      robot_type:=${ROBOT_TYPE:-quadruped}
      use_sim_time:=true
      params_override:=${NAV2_PARAMS:-__robot_default__}

  perception:
    <<: *common
    image: ${REGISTRY:-local}/demo-aquila-perception:${TAG:-dev}
    platform: linux/arm64
    command: ros2 launch demo_bringup perception.launch.py use_sim_time:=true
    # When a real camera exists (deploy mode), perception gains the device:
    #
    #   devices:
    #     - "/dev/video0:/dev/video0"
    #
    # Before debugging container permissions, confirm the node exists on the
    # module with `ls -l /dev/video*`. If the Device Tree did not instantiate the
    # sensor, no mapping fixes it (guia §7).

  # --- Tools ---------------------------------------------------------------
  # Inspection shell on the module side. Same profile pattern as the host:
  #   docker compose -f compose.module.yml --profile tools up -d tools
  #   docker compose -f compose.module.yml exec tools bash
  #   ros2 topic list | grep /demo/
  #
  # This is the intended way to verify the two machines see each other from the
  # module (guia §9). If the list comes back empty, check in this order:
  # ROS_DOMAIN_ID equal on both sides, `ip -br link` matching what
  # cyclonedds/module.xml selects, the Peers addresses, then the host firewall
  # on UDP 7400 and neighbours.
  tools:
    <<: *common
    image: ${REGISTRY:-local}/demo-aquila-tools:${TAG:-dev}
    platform: linux/arm64
    profiles: ["tools"]
    restart: "no"
    stdin_open: true
    tty: true
    command: sleep infinity

  # --- hw: real A1 driver --------------------------------------------------
  # Deliberately absent, not merely commented out as a stub to fill in.
  # See docker/hw/README.md: it carries a registered invariant collision
  # (unitree_sdk2 wants Fast DDS, rule 2 says CycloneDDS always) that must be
  # resolved by an ADR before this service exists. Out of ML3.5 scope.
